<html>
  <head>
    <meta charset="utf-8" />
    <title>Music Player</title>
    <style>/* Variables */
        @import url("https://fonts.googleapis.com/css?family=Barlow+Condensed:300,400,500,600,700,800,900|Barlow:300,400,500,600,700,800,900&display=swap");

        :root {
        --font-01: "Barlow", sans-serif;
        --font-02: "Barlow Condensed", sans-serif;
        --m-01: #e8e8f0;
        --m-02: #ffedc0;    
        --cubic: cubic-bezier(0.51, -0.12, 0.25, 1.15);
        }

        @media screen and (max-width: 640px) {
        .about {
            display: none;
        }
        }

        @media screen and (max-height: 600px) {
        .about {
            display: none;
        }
        }

        .referer-warning {
            background: black;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            padding: 0.75em;
            color: white;
            text-align: center;
            font-family: 'Lato', 'Lucida Grande', 'Lucida Sans Unicode', Tahoma, system-ui, Sans-Serif;
            line-height: 1.2;
            font-size: 1rem;
            position: relative;
            z-index: 2;
        }
        .referer-warning h1 {
            font-size: 1.2rem;
            margin: 0;
        }
        .referer-warning a {
            color: #56bcf9;
        }

        .about {
        --cubic: cubic-bezier(0.64, 0.01, 0.07, 1.65);
        --transition: 0.6s var(--cubic);
        --size: 40px;
        position: fixed;
        z-index: 10;
        bottom: 10px;
        right: 10px;
        width: var(--size);
        height: var(--size);
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        transition: all 0.2s ease;
        }

        .about .bg_links {
        width: var(--size);
        height: var(--size);
        border-radius: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 100%;
        backdrop-filter: blur(5px);
        position: absolute;
        cursor: pointer;
        }

        .about .logo {
        width: var(--size);
        height: var(--size);
        z-index: 9;
        background-image: url("./img/index_swiper_048/logo_white.svg");
        background-size: 50%;
        background-repeat: no-repeat;
        background-position: 10px 7px;
        opacity: 0.9;
        transition: all 1s 0.2s ease;
        bottom: 0;
        right: 0;
        }

        .about .social {
        opacity: 0;
        right: 0;
        bottom: 0;
        }

        .about .social .icon {
        width: 100%;
        height: 100%;
        background-size: 20px;
        background-repeat: no-repeat;
        background-position: center;
        background-color: transparent;
        display: flex;
        transition: all 0.2s ease, background-color 0.4s ease;
        opacity: 0;
        border-radius: 100%;
        }

        .about .social.portfolio .icon {
        background-image: url("./img/index_swiper_048/link.svg");
        }

        .about .social.dribbble .icon {
        background-image: url("./img/index_swiper_048/dribbble.svg");
        }

        .about .social.linkedin .icon {
        background-image: url("./img/index_swiper_048/linkedin.svg");
        }

        .about:hover {
        width: 105px;
        height: 105px;
        transition: all var(--transition);
        }

        .about:hover .logo {
        opacity: 1;
        transition: all 0.6s ease;
        }

        .about:hover .social {
        opacity: 1;
        }

        .about:hover .social .icon {
        opacity: 0.9;
        }

        .about:hover .social.portfolio {
        right: 0;
        bottom: calc(100% - 40px);
        transition: all 0.3s 0s var(--cubic);
        }

        .about:hover .social.portfolio .icon:hover {
        background-color: #698fb7;
        }

        .about:hover .social.dribbble {
        bottom: 45%;
        right: 45%;
        transition: all 0.3s 0.15s var(--cubic);
        }

        .about:hover .social.dribbble .icon:hover {
        background-color: #ea4c89;
        }

        .about:hover .social.linkedin {
        bottom: 0;
        right: calc(100% - 40px);
        transition: all 0.3s 0.25s var(--cubic);
        }

        .about:hover .social.linkedin .icon:hover {
        background-color: #0077b5;
        }

        * {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 0;
        -webkit-tap-highlight-color: transparent;
        text-decoration: none;
        color: inherit;
        }

        *::focus {
        outline: 0;
        }

        .wrapper {
        display: grid;
        width: 100%;
        /* height: 100vh; */
        align-items: center;
        justify-content: center;
        color: white;
        font-family: "Barlow", sans-serif;
        user-select: none;
        letter-spacing: 0.8px;
        }

        @media screen and (max-height: 600px) {
        .wrapper {
            height: 100% !important;
            min-height: 600px;
        }
        }

        .wrapper .content {
        width: 375px;
        height: 760px;
        margin: 60px 0;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        box-shadow: 0px 30px 80px rgba(0, 0, 0, 0.3);
        }

        @media screen and (max-width: 640px) {
        .wrapper .content {
            width: 100%;
            height: 100%;
            border-radius: 0px;
            margin-bottom: 0px;
            margin: 0px 0;
        }
        }

        .wrapper .content .icon {
        width: 24px;
        height: 24px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: contain;
        background-repeat: no-repeat;
        }

        .wrapper .content .icon:before {
        position: absolute;
        content: "";
        width: 24px;
        height: 24px;
        z-index: 1;
        background-size: contain;
        background-repeat: no-repeat;
        }

        .wrapper .content .icon:active:before {
        width: 28px;
        height: 28px;
        }

        .wrapper .content .icon.shuffle:before {
        background-image: url("./img/index_swiper_048/shuffle.svg");
        opacity: 0.5;
        }

        .wrapper .content .icon.prev:before {
        background-image: url("./img/index_swiper_048/prev.svg");
        }

        .wrapper .content .icon.play:before {
        background-image: url("./img/index_swiper_048/play.svg");
        }

        .wrapper .content .icon.next:before {
        background-image: url("./img/index_swiper_048/next.svg");
        }

        .wrapper .content .icon.repeat:before {
        background-image: url("./img/index_swiper_048/repeat.svg");
        opacity: 0.5;
        }

        .wrapper .content .icon.bottomExpand {
        background-image: url("./img/index_swiper_048/arrow-down.svg");
        }

        .wrapper .content .icon.topExpand {
        background-image: url("./img/index_swiper_048/arrow-down.svg");
        }

        .wrapper .content .icon.menuHamburguer {
        background-image: url("./img/index_swiper_048/menu.svg");
        }

        .wrapper .content .icon.plus:before {
        background-image: url("./img/index_swiper_048/plus.svg");
        }

        .wrapper .content .icon.heart:before {
        background-image: url("./img/index_swiper_048/heart.svg");
        }

        .wrapper .content .icon.heart.fave:before {
        animation: fave 0.3s ease;
        background-image: url("./img/index_swiper_048/fave.svg");
        }

        @keyframes fave {
        50% {
            width: 40px;
            height: 40px;
        }
        100% {
            width: 24px;
            height: 24px;
        }
        }

        .wrapper .content .icon.close:before {
        background-image: url("./img/index_swiper_048/close.svg");
        }

        /* Menu Bar & Music Groups */
        .wrapper .content .topContent {
        width: 100%;
        max-height: 60px;
        background-color: rgba(232, 232, 240, 0.5);
        display: flex;
        justify-content: space-between;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        box-sizing: border-box;
        backdrop-filter: blur(5px);
        transition: all 0.4s 0.2s ease;
        }

        .wrapper .content .topContent .menuBar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        box-sizing: border-box;
        }

        .wrapper .content .topContent .menuBar .appName {
        font-weight: 600;
        font-size: 16px;
        text-transform: uppercase;
        }

        .wrapper .content .topContent .musicGroups {
        width: 100%;
        height: 80px;
        margin-top: 25px;
        opacity: 0;
        transform: translateX(100px);
        transition: all 0.4s ease;
        visibility: hidden;
        cursor: grab;
        }

        .wrapper .content .topContent .musicGroups:active {
        cursor: grabbing;
        }

        .wrapper .content .topContent .musicGroups .swiper-slide {
        width: 150px;
        height: 80px;
        margin-right: 20px;
        }

        .wrapper .content .topContent .musicGroups .swiper-slide:first-child {
        margin-left: 20px;
        }

        .wrapper .content .topContent .musicGroups .group {
        position: relative;
        border-radius: 4px;
        cursor: pointer;
        overflow: hidden;
        }

        .wrapper .content .topContent .musicGroups .group:before {
        position: absolute;
        content: "";
        width: 100%;
        height: 30px;
        bottom: 0;
        z-index: 2;
        }

        .wrapper .content .topContent .musicGroups .group figure {
        margin: 0;
        height: 100%;
        width: 100%;
        }

        .wrapper .content .topContent .musicGroups .group figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(0.2);
        }

        .wrapper .content .topContent .musicGroups .group figure:before {
        position: absolute;
        content: "";
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, #252525 10%, transparent 100%);
        top: 0;
        left: 0;
        opacity: 0.8;
        z-index: 1;
        }

        .wrapper .content .topContent .musicGroups .group .titleGroup {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        z-index: 3;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        }

        .wrapper .content .topContent.expand {
        max-height: 190px;
        transition: all 0.4s ease;
        }

        .wrapper .content .topContent.expand .topExpand {
        transform: rotate(180deg);
        }

        .wrapper .content .topContent.expand .musicGroups {
        opacity: 1;
        transform: translateX(0px);
        visibility: visible;
        }

        /* Middle Content - Album Covers */
        /* Album Covers */
        .middleContent {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .middleContent .albumContent {
            margin: 40px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .middleContent .albumContent.small {
            width: 200px;
        }

        .middleContent .albumContent.small .albumCover {
            width: 200px;
            height: 200px;
            transition: all 0.4s ease;
        }

        @media screen and (max-width: 480px) {
            .middleContent .albumContent {
                width: 200px;
            }

            .middleContent .albumContent .albumCover {
                width: 200px;
                height: 200px;
                transition: all 0.4s ease;
            }
        }

        .middleContent .albumCover {
            width: 280px;
            height: 280px;
            overflow: hidden;
            box-shadow: 0px 30px 40px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            position: relative;
            transition: all 0.4s 0.2s ease;
            z-index: -1;
        }

        .middleContent .albumCover:before {
            position: absolute;
            content: "";
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.8) -20%, transparent 50%);
        }

        .middleContent .albumCover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .middleContent .artistName,
        .middleContent .songName {
            text-align: center;
            font-weight: 400;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.04em;
            z-index: 2;
        }

        .middleContent .artistName {
            text-transform: uppercase;
            margin: 30px 0 10px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .middleContent .settings {
            width: 100%;
            height: 40px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            box-sizing: border-box;
            position: fixed;
            transition: all 0s ease;
            transform: translateY(-100px);
            opacity: 0;
        }

        .middleContent .playlistsContent {
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            height: 100%;
            position: fixed;
            left: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 0 40px 0;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            transform: translateY(calc(-100% - 60px));
            transition: all 0.8s cubic-bezier(0.8, -0.02, 0.25, 1);
        }

        .middleContent .playlistsContent .close {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .middleContent .playlistsContent .playlist {
            width: calc(100% - 40px);
            height: 100px;
            min-height: 60px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            z-index: 3;
            transition: all 0.2s ease;
            border: 0px solid white;
            cursor: pointer;
            opacity: 0.6;
        }

        .middleContent .playlistsContent .playlist:last-child {
            margin-bottom: 0;
        }

        .middleContent .playlistsContent .playlist .checkbox {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 24px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 2;
            position: absolute;
            right: 10px;
            top: 10px;
            border-radius: 4px;
        }

        .middleContent .playlistsContent .playlist .checkbox:before {
            position: absolute;
            content: "";
            width: 0%;
            height: 0%;
            z-index: 1;
            background-size: contain;
            background-image: url("./img/index_swiper_048/check.svg");
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.6, 0.02, 0.18, 1.25);
        }

        .middleContent .playlistsContent .playlist .playlistThumb {
            width: 80px;
            height: calc(100% - 20px);
            border-radius: 4px;
            overflow: hidden;
            z-index: 1;
            margin-left: 10px;
        }

        .middleContent .playlistsContent .playlist .playlistThumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .middleContent .playlistsContent .playlist .playlistBg {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #5a5a5a;
        }

        .middleContent .playlistsContent .playlist .playlistBg img {
            width: 120%;
            height: 160%;
            object-fit: cover;
            filter: blur(8px) grayscale(1);
            opacity: 0.6;
        }

        .middleContent .playlistsContent .playlist .playlistBg:before {
            position: absolute;
            content: "";
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.8) -20%, transparent 50%);
        }

        .middleContent .playlistsContent .playlist .playlistTitle {
            z-index: 1;
            margin-left: 20px;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .middleContent .playlistsContent .playlist.selected {
            opacity: 1;
            transition: all 0.2s ease;
        }

        .middleContent .playlistsContent .playlist.selected .checkbox:before {
            width: 20px;
            height: 20px;
            opacity: 1;
        }

        .middleContent .playlistsContent .playlist.selected .playlistBg img {
            filter: blur(8px) grayscale(0);
        }

        .middleContent .swiper-container {
            height: 100%;
        }

        .middleContent .swiper-slide {
            width: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .middleContent .swiper-slide.open {
            transform: translateY(0);
        }

        .middleContent .swiper-slide-active .settings {
            transition: all 0.4s 0.4s ease;
            opacity: 1;
            transform: translateY(0px);
        }

        .middleContent .swiper-slide-active.open .playlistsContent {
            transform: translateY(0);
        }


        /* // Player */
        .bottomContent {
            width: 100%;
            min-height: 100px;
            max-height: 100px;
            background-color: rgba(0, 0, 0, 0.5); /* Replaced $m-01 with rgba color */
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
            transition: all 0.4s 0.2s ease;
            padding: 5px 30px 20px 30px;
            box-sizing: border-box;
        }

        .bottomContent .bottomExpand {
            transform: rotate(-180deg);
            opacity: 0.5;
        }

        .bottomContent .progressBar {
            width: 100%;
            visibility: hidden;
            height: 0;
            opacity: 0;
            transition: all 0.4s ease;
            transform: translateY(-60px);
        }

        .bottomContent .progressBar .timer {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .bottomContent .progressBar .barTimer {
            width: 100%;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 5px;
            position: relative;
        }

        .bottomContent .progressBar .barTimer .progress {
            position: absolute;
            background-color: white;
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: all 0.4s ease;
        }

        .bottomContent .player {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s 0.2s ease;
        }

        .bottomContent .player .btnPlay {
            background-color: rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .bottomContent .player .btnPlay.pause {
            background-color: rgba(255, 255, 255, 0.4);
            position: unset;
            margin-top: 0;
        }
        .bottomContent .player .swiper-button-prev {
            position: unset;
            margin-top: 0;
        }

        .bottomContent .player .swiper-button-next {
            position: unset;
            margin-top: 0;
        }

        .bottomContent .player .btnPlay.pause .play:before {
            background-image: url("./img/index_swiper_048/pause.svg");
        }

        .bottomContent.expand {
            transition: all 0.4s ease;
            min-height: 200px;
            max-height: 200px;
            padding: 10px 30px 20px 30px;
        }

        .bottomContent.expand .bottomExpand {
            transform: rotate(0deg);
            opacity: 1;
        }

        .bottomContent.expand .progressBar {
            opacity: 1;
            visibility: visible;
            height: 50px;
            transition: all 0.4s 0.2s ease;
            transform: translateY(-10px);
        }

        .bottomContent.expand .player .btnPlay {
            width: 60px;
            height: 60px;
        }

        .bottomContent.expand .player .btnPlay .icon:before {
            width: 32px;
            height: 32px;
        }

        .bottomContent.expand .player .btnPlay .icon:active:before {
            width: 38px;
            height: 38px;
        }

        /* Album Covers Background */
        .albumBg {
            position: absolute;
            width: 100%;
            max-height: 760px;
            height: 100%;
            top: 0;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @media screen and (max-width: 768px) {
            .albumBg {
                max-height: 100vh;
            }
        }

        @media screen and (max-width: 480px) {
            .albumBg {
                max-height: 100%;
                height: 100%;
                min-height: 600px;
            }
        }

        .albumBg:before,
        .albumBg:after {
            position: absolute;
            content: "";
            width: 100%;
            height: 100%;
            top: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) -40%, transparent 50%);
            z-index: 1;
        }

        .albumBg:after {
            top: initial;
            bottom: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5) -60%, transparent 50%);
        }

        .albumBg .bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .albumBg .bg:before {
            position: absolute;
            content: "";
            width: 150%;
            height: 150%;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .albumBg .bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .albumBg.animeBg .bg {
            animation: animeBg 0.6s ease-in-out both;
        }

        @keyframes animeBg {
            0% {
                width: 100%;
                height: 100%;
            }

            50% {
                width: 130%;
                height: 130%;
            }

            100% {
                width: 100%;
                height: 100%;
            }
        }

        .albumBg.animeBg .bg:before {
            animation: animeBg2 0.6s ease-in-out both;
        }

        @keyframes animeBg2 {
            0% {
                width: 150%;
                height: 150%;
                backdrop-filter: blur(10px);
            }

            50% {
                backdrop-filter: blur(40px);
            }

            100% {
                width: 150%;
                height: 150%;
                backdrop-filter: blur(10px);
            }
        }

        .bodyBg {
            width: 100%;
            height: 100%;
            position: fixed;
            z-index: -2;
            transition: all 0.4s ease;
        }

        .swiper-button-prev,
        .swiper-button-next {
            all: unset;
        }

        .swiper-button-prev::before {
            content: "" !important;
        }
        .swiper-button-prev::after {
            content: "" !important;
        }
        .swiper-button-next::before {
            content: "" !important;
        }
        .swiper-button-next::after {
            content: "" !important;
        }

    </style>

    <body>
        <!-- <div class="referer-warning">

        <!-- Slider main container-->
        <!-- about -->
        <div class="about">
            <a class="bg_links social portfolio" href="https://www.rafaelalucas.com" target="_blank">
            <span class="icon"></span>
            </a>
            <a class="bg_links social dribbble" href="https://dribbble.com/rafaelalucas" target="_blank">
            <span class="icon"></span>
            </a>
            <a class="bg_links social linkedin" href="https://www.linkedin.com/in/rafaelalucas/" target="_blank">
            <span class="icon"></span>
            </a>
            <a class="bg_links logo"></a>
        </div>
        <!-- end about -->
        
        <div class="wrapper">
            <div class="content">
            <div class="topContent">
                <div class="menuBar">
                    <div class="icon topExpand"></div>
                    <p class="appName">Your Library</p>
                    <div class="icon menuHamburguer"></div>
                </div>
                <div class="musicGroups">
                    <!-- Slider main container -->
                    <div class="swiper-container slider-two">
                        <!-- Additional required wrapper -->
                        <div class="swiper-wrapper slider-two">
                        </div>
        
                    </div>
                    <!-- end Slider main container -->
        
                </div>
        
            </div>
            <div class="middleContent">
        
                <!-- Slider main container -->
                <div class="swiper-container slider-one">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper slider-one">
                    </div>
                </div>
                <!-- end Slider main container -->
            </div>
            <div class="bottomContent">
                <div class="icon bottomExpand"></div>
                <div class="progressBar">
                    <div class="timer">
                        <span class="currentTime">00:00</span>
                        <span class="endTime"></span>
                    </div>
                    <div class="barTimer"><span class="progress"></span></div>
                </div>
                <div class="player">
                    <div class="icon shuffle"></div>
                    <div class="icon prev swiper-button-prev"></div>
                    <div class="btnPlay">
                        <div class="icon play"></div>
                    </div>
                    <div class="icon next swiper-button-next"></div>
                    <div class="icon repeat"></div>
        
                </div>
            </div>
        
            <div class="albumBg">
                <figure class="bg"><img class="imageBg" src="" alt=""></figure>
            </div>
        
            </div>
            <div class="bodyBg"></div>
        </div>
            
        
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                 ////////////////
                // Variables
                ////////////////

                const iconTopExpand = document.querySelector(".icon.topExpand"),
                        iconBottomExpand = document.querySelector(".icon.bottomExpand"),
                        topContent = document.querySelector(".topContent"),
                        bottomContent = document.querySelector(".bottomContent"),
                        playBtn = document.querySelector(".btnPlay"),
                        musicGroups = document.querySelector(".swiper-wrapper.slider-two"),
                        swipperWrapper = document.querySelector(".swiper-wrapper.slider-one"),
                        imageBg = document.querySelector(".imageBg"),
                        albumBg = document.querySelector(".albumBg"),
                        wrapper = document.querySelector(".wrapper"),
                        bodyBg = document.querySelector(".bodyBg"),
                        next = document.querySelector(".swiper-button-next"),
                        prev = document.querySelector(".swiper-button-prev");

                // Songs
                const songs = [
                    {
                        img: "./img/index_swiper_048/covers/jain.jpg",
                        artistName: "Jain",
                        songName: "Makeba",
                        song: "./img/index_swiper_048/songs/song1.mp3",
                        color: "#f5c63d"
                    },
                    {
                        img: "./img/index_swiper_048/covers/ohland.jpg",
                        artistName: "Oh Land",
                        songName: "Postpone the Bad",
                        song: "./img/index_swiper_048/songs/song2.mp3",
                        color: "#afc5c3"
                    },
                    {
                        img: "./img/index_swiper_048/covers/angele.jpg",
                        artistName: "Angèle",
                        songName: "La Loi de Murphy",
                        song: "./img/index_swiper_048/songs/song3.mp3",
                        color: "#74c2dd"
                    },
                    {
                        img: "./img/index_swiper_048/covers/angele.jpg",
                        artistName: "Broods",
                        songName: "Bridges",
                        song: "./img/index_swiper_048/songs/song1.mp3",
                        color: "#a3b8b0"
                    },
                    {
                        img: "./img/index_swiper_048/covers/alice.jpg",
                        artistName: "Alice Phoebe Lou",
                        songName: "Orbit",
                        song: "./img/index_swiper_048/songs/song2.mp3",
                        color: "#38736d"
                    },
                    {
                        img: "./img/index_swiper_048/covers/feist.jpg",
                        artistName: "Feist",
                        songName: "The Bad in Each Other",
                        song: "./img/index_swiper_048/songs/song3.mp3",
                        color: "#a4b1b2"
                    },

                    {
                        img: "./img/index_swiper_048/covers/dagny.jpg",
                        artistName: "Dagny",
                        songName: "Ultraviolet",
                        song: "./img/index_swiper_048/songs/song1.mp3",
                        color: "#8098ce"
                    },
                    {
                        img: "./img/index_swiper_048/covers/sigrid.jpg",
                        artistName: "Sigrid",
                        songName: "Dynamite",
                        song: "./img/index_swiper_048/songs/song2.mp3",
                        color: "#1a91bd"
                    }
                ];

                // Music Groups
                const groups = [
                    {
                        title: "Songs",
                        img: "./img/index_swiper_048/covers/img06.jpg",
                    },
                    {
                        title: "Artists",
                        img: "./img/index_swiper_048/covers/img07.jpg",
                    },
                    {
                        title: "Playlists",
                        img: "./img/index_swiper_048/covers/pexels-photo-761963.jpeg",
                    },
                    {
                        title: "Favourites",
                        img: "./img/index_swiper_048/covers/img09.jpg",
                    }
                ];

                // Playlists
                const playlists = [
                    {
                        title: "Pop Music",
                        img:
                        "./assets/swiper_048/pexels-photo-761963-238f4fb0.jpeg"
                    },
                    {
                        title: "On the road!",
                        img:
                        "./assets/swiper_048/pexels-photo-3049327-4d133eb5.jpeg"
                    },
                    {
                        title: "Christmas Songs",
                        img:
                        "./assets/swiper_048/pexels-photo-1661905-081d5ce1.jpeg"
                    },
                    {
                        title: "Rainy days",
                        img:
                        "./assets/swiper_048/pexels-photo-216657-f903d902.jpeg"
                    }
                ];

                ////////////////
                // Events
                ////////////////

                iconTopExpand.addEventListener("click", expandTop);
                iconBottomExpand.addEventListener("click", expandBottom);
                playBtn.addEventListener("click", playSong);

                ////////////////
                // Functions
                ////////////////

                function playSong() {
                    if (playBtn.classList.contains("pause")) {
                        playBtn.classList.remove("pause");
                        document.querySelector(".swiper-slide-active audio").pause();
                    } else {
                        playBtn.classList.add("pause");
                        document.querySelector(".swiper-slide-active audio").play();
                    }
                    progressBar();
                }

                function expandTop() {
                    if (topContent.classList.contains("expand")) {
                        topContent.classList.remove("expand");
                    } else {
                        topContent.classList.add("expand");

                        //Swiper Music Goups
                        var mySwiper2 = new Swiper(".swiper-container.slider-two", {
                            // Optional parameters
                            direction: "horizontal",
                            slidesPerView: "auto",
                            draggable: true
                        });
                    }
                    albumSize();
                }

                function expandBottom() {
                    if (bottomContent.classList.contains("expand")) {
                        bottomContent.classList.remove("expand");
                    } else {
                        bottomContent.classList.add("expand");
                    }
                    albumSize();
                    progressBar();
                }

                // change Album size

                function albumSize() {
                    const albumContent = document.querySelectorAll(".albumContent");

                    if (
                        topContent.classList.contains("expand") &&
                        bottomContent.classList.contains("expand")
                    ) {
                        albumContent.forEach(function(el) {
                            el.classList.add("small");
                        });
                    } else {
                        albumContent.forEach(function(el) {
                            el.classList.remove("small");
                        });
                    }
                }

                //Swiper Albums

                songs.forEach(function(el) {
                    let template = `
                <div class="swiper-slide">
                <div class="settings">
                <div class="icon heart"></div>
                <div class="icon plus"></div>
                </div>
                <audio src="${el.song}"></audio>
                <div class="albumContent">
                <div class="albumCover" style="background-color:${
                    el.color
                    }"><img src="${el.img}"></div>
                <p class="artistName">${el.artistName}</p>
                <p class="songName">${el.songName}</p></div>
                <div class="playlistsContent">
                <div class="icon close"></div>
                </div>
                </div>`;

                    swipperWrapper.insertAdjacentHTML("beforeend", template);
                });

                // To Create Playlists
                playlists.forEach(function(el) {
                    let templatePlaylist = `
                <div class="playlist">
                <span class="checkbox"></span>
                <figure class="playlistBg"><img src="${el.img}"></figure>
                <figure class="playlistThumb"><img src="${el.img}"></figure>
                <p class="playlistTitle">${el.title}</p></div>`;

                    var playlistContent = document.querySelectorAll(".playlistsContent");

                    playlistContent.forEach(function(el) {
                        el.insertAdjacentHTML("beforeend", templatePlaylist);
                    });
                });

                // Slider Songs (Middle)

                var mySwiper = new Swiper(".swiper-container.slider-one", {
                    // Optional parameters
                    direction: "horizontal",
                    loop: true,
                    centeredSlides: true,
                    slidesPerView: 1,
                    spaceBetween: 20,
                    speed: 600,
                    allowTouchMove: false,
                    effect: "coverflow",

                    coverflowEffect: {
                        rotate: 40,
                        slideShadows: false
                    },

                    // Navigation arrows
                    navigation: {
                        nextEl: ".swiper-button-next",
                        prevEl: ".swiper-button-prev"
                    }
                });

                // Change Song & Album BG
                next.addEventListener("click", changeSong);
                prev.addEventListener("click", changeSong);

                function changeSong() {
                    if (playBtn.classList.contains("pause")) {
                        document.querySelectorAll("audio").forEach(function(el) {
                            el.pause();
                        });
                        document.querySelector(".swiper-slide-active audio").play();
                    }
                    changeBg();
                    progressBar();
                    closePlaylists();
                    changeBgColor();
                }

                function changeBg() {
                    albumBg.classList.add("animeBg");

                    setTimeout(() => {
                        imageBg.src = document.querySelector(
                            ".slider-one .swiper-slide-active img"
                        ).src;
                    }, 300);

                    setTimeout(() => {
                        albumBg.classList.remove("animeBg");
                    }, 700);
                }

                function changeBgColor() {
                    var getColor = document.querySelector(
                        ".slider-one .swiper-slide-active .albumCover"
                    ),
                        activeColor = getColor.style.backgroundColor;

                    setTimeout(() => {
                        bodyBg.style.backgroundColor = activeColor;
                    }, 200);
                }

                // Music Groups

                for (let i = 0; i < groups.length; i++) {
                    const { title, img } = groups[i];

                    var template2 = `<div class="swiper-slide group">
                <figure><img src="${img}"></figure>
                <p class = "titleGroup">${title}</p>
                </div>`;

                    musicGroups.insertAdjacentHTML("beforeend", template2);
                }

                // Add favourites & Playlist

                const heart = document.querySelectorAll(".heart"),
                        plus = document.querySelectorAll(".plus"),
                        close = document.querySelectorAll(".close"),
                        playlist = document.querySelectorAll(".playlist");

                heart.forEach(function(el) {
                    el.addEventListener("click", addFave);
                });

                plus.forEach(function(el) {
                    el.addEventListener("click", openPlaylists);
                });

                close.forEach(function(el) {
                    el.addEventListener("click", openPlaylists);
                });

                playlist.forEach(function(el) {
                    el.addEventListener("click", addPlaylist);
                });

                function addFave(e) {
                    if (e.currentTarget.classList.contains("fave")) {
                        e.currentTarget.classList.remove("fave");
                    } else {
                        e.currentTarget.classList.add("fave");
                    }
                }

                function openPlaylists(e) {
                    if (
                        e.currentTarget
                        .closest(".swiper-slide-active")
                        .classList.contains("open")
                    ) {
                        e.currentTarget
                            .closest(".swiper-slide-active")
                            .classList.remove("open");
                    } else {
                        e.currentTarget.closest(".swiper-slide-active").classList.add("open");
                    }
                }

                function closePlaylists() {
                    document.querySelector(".swiper-slide-active").classList.remove("open");
                }

                function addPlaylist(e) {
                    if (e.currentTarget.classList.contains("selected")) {
                        e.currentTarget.classList.remove("selected");
                    } else {
                        e.currentTarget.classList.add("selected");
                    }
                }

                // Song Progress Bar

                function formatTime(seconds) {
                    minutes = Math.floor(seconds / 60);
                    minutes = minutes >= 10 ? minutes : "0" + minutes;
                    seconds = Math.floor(seconds % 60);
                    seconds = seconds >= 10 ? seconds : "0" + seconds;
                    return minutes + ":" + seconds;
                }

                function progressBar() {
                    var songDuration = document.querySelector(".swiper-slide-active audio")
                    .duration,
                        endTime = document.querySelector(".endTime"),
                        songAudio = document.querySelector(".swiper-slide-active audio"),
                        currentTime = document.querySelector(".currentTime");

                    endTime.innerHTML = formatTime(songDuration);

                    songAudio.ontimeupdate = function() {
                        var progress = document.querySelector(".progress");
                        progress.style.width =
                            songAudio.currentTime * 100 / songDuration + "%";
                        currentTime.innerHTML = formatTime(songAudio.currentTime);
                    };
                }

                ////////////////
                // Call Functions
                ////////////////

                changeBg();
                progressBar();
                changeBgColor();

                wrapper.style.height = window.innerHeight + "px";

                console.log(window.innerHeight);
            });
        </script>
    </body>
