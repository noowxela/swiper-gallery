<html>
  <head>
    <title>iFrame Coverflow</title>
    <style>/* Variables */
      body {
          background: #666;
          margin: 0px;
          -webkit-transform: scale(1);
          -webkit-transition: scale 2s;
      }
      .siteContainer {
          width: 100%;
          height: 100%;
          overflow:hidden;
          min-width: 1200px;
      }
      iframe {
          width: 100%;
          height: 95vw;
          border: solid 4px transparent;
          -webkit-transition: opacity 2s;
      }
      iframe:not(:first-child) {
          display: none;
      }
      body.stacked {
          -webkit-transform: scale(0.9);
      }
      body.stacked .siteContainer {
          padding:50px;
          -webkit-perspective: 1000px;
      }
      body.stacked iframe {
          -webkit-transform: rotateY(45deg);
          width: 400px;
          float: left;
          height: 300px;
          margin-left: 10px;
      }
      body.stacked iframe:not(:first-child) {
          margin-left: -200px;
          display:block;
      }
      body.stacked iframe:hover {
          border-color: red;
          -webkit-transform: scale(1.1);
          position: relative;
          z-index: 999;
      }

    </style>
  </head>
  <body class="stacked">
    <button onclick="toggleSiteSel()">CoverFlow</button>
    <button onclick="switchPrev()">&lt; Prev</button>
    <button onclick="switchNext()">Next &gt;</button>
    <div class="siteContainer">
        <iframe src="https://www.codesign2.co.uk"></iframe>
        <iframe src="https://www.lewiscowles.co.uk"></iframe>
        <iframe src="https://www.techlete.co.uk"></iframe>
    </div>
    
    <script>
      window.toggleSiteSel = function() {
          var body = document.querySelector('body');
          //console.log(body.getAttributeNode('class'))
          //console.log(getMethods(body.getAttributeNode('class')));
          //console.log(getProperties(body));
          if(document.querySelectorAll('body.stacked').length > 0) {
            body.className = (body.className+'').replace('stacked','');
          } else {
            body.className += ' stacked';
          }
      };
      window.switchPrev = function() {
          var siteContainer = document.querySelectorAll('.siteContainer')[0];
          var sites = document.querySelectorAll('.siteContainer iframe');
          siteContainer.appendChild(sites[0]);
      };
      window.switchNext = function() {
          var siteContainer = document.querySelectorAll('.siteContainer')[0];
          var sites = document.querySelectorAll('.siteContainer iframe');
          siteContainer.insertBefore(sites[sites.length-1],sites[0]);
      };
      window.getMethods = function(obj) {
          var res = [];
          for(var m in obj) {
              if(typeof obj[m] == "function") {
                  res.push(m)
              }
          }
          return res;
      };
      window.getProperties = function(obj) {
          var res = [];
          for(var m in obj) {
              if(typeof obj[m] != "function") {
                  res.push(m)
              }
          }
          return res;
      };
    </script>
  </body>
</html>
