<html>
  <head>
    <title>Simplest inner glow card animation</title>
    <style>/* Variables */
      /* must register --a to animate it */
      @property --a {
        syntax: '<angle>';
        initial-value: 0deg;
        /* used only on pseudo, nowhere to be inherited, * better perf if set false */
        inherits: false;
      }
      .card {
        /* hide outer part of glow */
        overflow: hidden;
        /* needed for absolutely positioned pseudo */
        position: relative;
        /* adjust width as needed IF it's even necessary to set */
        width: Min(12.5em, 80vmin);
        /* adjust aspect-ratio OR height IF height not given by content */
        aspect-ratio: 1;
        /* round outer card corners */
        border-radius: 0.5em;
        /* text & layout styles below just for prettifying */
        place-self: center;
        place-content: center;
        padding: 0.5em;
        color: #ededed;
        font: clamp(1em, 4vw, 2em) sans-serif;
        text-align: center;
        text-transform: uppercase;
        text-wrap: balance;
      }
      .card::before {
        /* grid doesn't work for stacking when a stacked item is text node */
        position: absolute;
        /* place behind card content, so card text is selectable, etc */
        z-index: -1;
        /* best if inset is at least half the border-width with minus */
        inset: -1em;
        /* reserve space for border */
        border: solid 1.25em;
        border-image: conic-gradient(from var(--a), #690, #9c3, #ce6, #069, #39c, #906, #c39, #f60, #f90, #fc0, #690) 1;
        /* adjust gradient as needed, I just used a random palette */
        /* blur this pseudo */
        filter: blur(0.75em);
        /* tweak animation duration as necessary */
        animation: a 4s linear infinite;
        /* needed so pseudo is displayed */
        content: '';
      }
      /* animate --a from its initial-value 0deg to 1turn */
      @keyframes a {
        to {
          --a: 1turn;
        }
      }
      /* prettifying and layout stuff, not needed for card glow part */
      html, body, div {
        display: grid;
      }
      html {
        min-height: 100%;
      }
      body {
        background: url(https://images.unsplash.com/photo-1729824346255-52a8f898fe84?w=1400) 50%/ cover #212121;
        /* just to illustrate card transparency */
        background-blend-mode: multiply;
      }
      
      
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  </head>
  <body>
    <!--- This may need to change --->
    <div class="card">I'm a card with an inner glow</div>
    
    <script>
        window.onload = function () {
          
        };

    </script>
  </body>
</html>
