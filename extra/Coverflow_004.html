        box-shadow: 0 1px 25px 10px rgba(0, 0, 0, 0.6);
      }
      .prev-arrow, .next-arrow {
        cursor: pointer;
        z-index: 10;
        position: absolute;
        top: 50%;
        padding: 1.5rem 2rem;
        color: rgba(255, 255, 255, 0.5);
        font-size: 3rem;
        line-height: 3rem;
        background: rgba(0, 0, 0, 0.00);
        border-radius: 1rem;
        transform-origin: 50% 50%;
        transform: translateY(-50%);
        transition: color 200ms, background 200ms;
      }
      .prev-arrow:hover, .next-arrow:hover, .prev-arrow:focus, .next-arrow:focus {
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.5);
      }
      .prev-arrow {
        left: 5%;
      }
      .prev-arrow:before {
        content: "❮";
      }
      .next-arrow {
        right: 5%;
      }
      .next-arrow:after {
        content: "❯";
      }
      
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  </head>
  <body>
    
    <div class="coverflow" data-coverflow-position="3">
      <a class="prev-arrow"></a>
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-1.jpg" data-coverflow-index="1">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-2.jpg" data-coverflow-index="2">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-3.jpg" data-coverflow-index="3">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-4.jpg" data-coverflow-index="4">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-5.jpg" data-coverflow-index="5">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-6.jpg" data-coverflow-index="6">
      <img class="coverflow__image" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/168886/bob-ross-7.jpg" data-coverflow-index="7">
      <a class="next-arrow"></a>
    </div>
    
    <script>
        window.onload = function () {
          //DOM elements
          const coverflowContainer = document.querySelector('.coverflow');
          const coverflowImages = [...document.querySelectorAll('.coverflow__image')];
          const prevArrow = document.querySelector('.prev-arrow');
          const nextArrow = document.querySelector('.next-arrow');

          //set indicies and initial position
          coverflowImages.forEach(function(coverflowImage, i) {
            coverflowImage.dataset.coverflowIndex = i + 1;
          });
          let coverflowPosition = Math.floor(coverflowImages.length/2) + 1;
          coverflowContainer.dataset.coverflowPosition = coverflowPosition;

          //navigation functions
          function viewPrevImage() {
            coverflowPosition = Math.max(1, coverflowPosition - 1);
            coverflowContainer.dataset.coverflowPosition = coverflowPosition;
          }
          function viewNextImage() {
            coverflowPosition = Math.min(coverflowImages.length, coverflowPosition + 1);
            coverflowContainer.dataset.coverflowPosition = coverflowPosition;
          }
          function jumpToImage(targetImage) {
            coverflowPosition = Math.min(coverflowImages.length, Math.max(1, targetImage.dataset.coverflowIndex));
            coverflowContainer.dataset.coverflowPosition = coverflowPosition;
          }

          //add event handlers
          prevArrow.addEventListener('click', viewPrevImage);
          nextArrow.addEventListener('click', viewNextImage);
          coverflowImages.forEach(function(image) {
            image.addEventListener('click', evt => jumpToImage(evt.target));
          });
          window.addEventListener('keyup', (evt) => {
            if (evt.which ===  37) { //left arrow
              viewPrevImage();
            } else if (evt.which === 39) { //right arrow
              viewNextImage();
            }
          });
        };

    </script>
  </body>
</html>
