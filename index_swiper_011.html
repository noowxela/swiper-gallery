<html>
  <head>
    <title>Swiper Timeline Progressbar</title>
    <style>
      :root {
        --primary-color: #000;
        --secondary-color: #888;
      }

      html,
      body {
        position: relative;
        height: 100%;
        overflow: hidden;
        background: #eee;
      }

      body {
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 16px;
        margin: 0;
        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container{
        width: 100%;
        padding-right: var(--bs-gutter-x,.75rem);
        padding-left: var(--bs-gutter-x,.75rem);
        margin-right: auto;
        margin-left: auto;
      }
      @media (min-width: 576px) {
        .container, .container-sm {
          max-width: 540px;
        }
      }
      .swiper-container-wrapper--timeline .swiper-slide {
        display: flex;
        background: #fff;
        min-height: 300px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }

      .swiper-container-wrapper--timeline .swiper-slide .container {
        padding: 0;
        width: 100%;
      }

      .swiper-container-wrapper--timeline .swiper-slide .title {
        font-size: 18px;
        opacity: 0;
        transition: opacity 0.5s ease 0.5s;
      }

      .swiper-container-wrapper--timeline .swiper-slide-active .title {
        opacity: 1;
      }

      .swiper-pagination-progressbar {
        position: relative !important;
        margin-bottom: 70px;
        background-color: transparent !important;
        height: 4px !important;
        border-bottom: 1px solid var(--secondary-color);
        /* width: 75% !important; */
      }

      .swiper-pagination-progressbar .swiper-pagination-progressbar-fill {
        background-color: var(--primary-color) !important;
        height: 3px !important;
        top: 2px !important;
      }

      /* .swiper-pagination-progressbar::before {
        position: absolute;
        top: 2px;
        left: -100%;
        width: 100%;
        height: 3px;
        background-color: var(--primary-color);
        content: "";
      } */

      /* .swiper-pagination-progressbar::after {
        position: absolute;
        top: 4px;
        right: -100%;
        width: 100%;
        height: 1px;
        background-color: var(--secondary-color);
        content: "";
      } */

      .swiper-pagination-custom {
        position: relative;
        list-style: none;
        margin: 1rem 0;
        padding: 0;
        display: flex;
        line-height: 1.66;
        bottom: 0;
        z-index: 11;
        width: 75%;
      }

      .swiper-pagination-switch {
        position: relative;
        width: 100%;
        height: 30px;
        line-height: 30px;
        display: block;
      }

      .swiper-pagination-switch .switch-title {
        position: absolute;
        font-weight: 400;
        right: 0;
        transform: translateX(50%);
        transition: all 0.2s ease-in-out;
        cursor: pointer;
        z-index: 1;
      }

      .swiper-pagination-switch .switch-title::after {
        position: absolute;
        /* top: calc(100% + 19px); */
        top: calc(100% + 28px);
        right: 50%;
        transform: translateX(50%) translateY(-50%);
        width: 12px;
        height: 12px;
        background: var(--primary-color);
        border-radius: 50%;
        content: "";
        transition: all 0.2s ease-in-out;
        z-index: 1;
      }

      .swiper-pagination-switch.active .switch-title {
        font-weight: 400;
        transition-delay: 0.4s;
      }

      .swiper-pagination-switch.active .switch-title::after {
        background: var(--primary-color);
        width: 25px;
        height: 25px;
        transition-delay: 0.4s;
      }

      .swiper-pagination-switch.active ~ .swiper-pagination-switch .switch-title {
        color: var(--secondary-color);
        font-weight: 400; /* Adjusted from 16px to 400 */
      }

      .swiper-pagination-switch.active ~ .swiper-pagination-switch .switch-title::after {
        background: var(--secondary-color);
      }


    </style>
    <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>

    <div class="container">
      <div class="swiper-container-wrapper swiper-container-wrapper--timeline">
        <!-- Timeline -->
        <ul class="swiper-pagination-custom">
          <li class='swiper-pagination-switch first active'><span class='switch-title'>1911</span></li>
          <li class='swiper-pagination-switch'><span class='switch-title'>1970</span></li>
          <li class='swiper-pagination-switch'><span class='switch-title'>2021</span></li>
          <li class='swiper-pagination-switch last'><span class='switch-title'>3000</span></li>
        </ul>
        <!-- Progressbar -->
        <div class="swiper-pagination swiper-pagination-progressbar swiper-pagination-horizontal"></div>
        <!-- Swiper -->
        <div class="swiper swiper-container swiper-container--timeline">
          <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><span class="title">Swiper Timeline Progressbar</span></div>
            <div class="swiper-slide"><span class="title">Title 2</span></div>
            <div class="swiper-slide"><span class="title">Title 3</span></div>
            <div class="swiper-slide"><span class="title">Title 4</span></div>
          </div>
        </div>
      </div>
    </div>
    
    <script>
      document.addEventListener('DOMContentLoaded', function () {
            // Initialize Swiper
      var mySwiper = new Swiper(".swiper", {
        autoHeight: true,
        // autoplay: {
        //   delay: 5000,
        //   disableOnInteraction: false
        // },
        speed: 500,
        direction: "horizontal",
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev"
        },
        pagination: {
          el: ".swiper-pagination",
          type: "progressbar"
        },
        loop: false,
        effect: "slide",
        spaceBetween: 30,
        on: {
          init: function () {
            // Handle custom pagination initialization
            const switches = document.querySelectorAll(".swiper-pagination-custom .swiper-pagination-switch");
            switches.forEach(switchEl => switchEl.classList.remove("active"));
            if (switches.length > 0) {
              switches[0].classList.add("active");
            }
          },
          slideChangeTransitionStart: function () {
            // Handle custom pagination switch state on slide change
            const switches = document.querySelectorAll(".swiper-pagination-custom .swiper-pagination-switch");
            switches.forEach(switchEl => switchEl.classList.remove("active"));
            if (switches.length > 0) {
              switches[mySwiper.realIndex].classList.add("active");
            }
          }
        }
      });

      // Handle custom pagination switch click
      document.querySelectorAll(".swiper-pagination-custom .swiper-pagination-switch").forEach((switchEl, index) => {
        switchEl.addEventListener("click", function () {
          mySwiper.slideTo(index);
          document.querySelectorAll(".swiper-pagination-custom .swiper-pagination-switch").forEach(switchEl => switchEl.classList.remove("active"));
          switchEl.classList.add("active");
        });
      });

      });
    </script>
  </body>
</html>
