<html>
  <head>
    <meta charset="utf-8" />
    <title>Amazing Responsive Slider</title>
    <style>/* Variables */
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900;1000&display=swap');
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        position: relative;
        height: 100vh;
        background-color: #9a99f2;

      }

      .swiper-container {
        border-radius: 5px;
        width: 70vw;
        overflow: hidden;
        height: fit-content;
        height: fit-content;
        font-size: 50px;
        position: relative;
        padding-bottom: 50px;
        font-family: sans-serif;
      }

      .swiper-slide {
        width: auto;
        height: fit-content;
        display: flex;
        height: auto;
        border-radius: 5px;
        overflow: hidden;
        align-items: flex-start;
        flex-direction: column;
        padding: 0px;
        font-family: Nunito;
        background-color: white;

      }

      .swiper-slide .ImgHolder {
        background-color: #4361ee;
        display: flex;
        width: 100%;
        height: auto;
        padding: 30px;
        border-bottom-left-radius: 20px;

      }

      .ContentHolder::before {
        background-color: #4361ee;
        content: '';
        width: 50px;
        height: 50px;
        position: absolute;
        top: -5px;
        z-index: -1;
        right: 0px;
      }

      .ContentHolder {
        position: relative;
        padding: 10px;
        background-color: white;
        border-top-right-radius: 20px;
      }

      .swiper-pagination-bullet {
        background-color: white;
        opacity: 1;
        border: 1px solid #4361ee;
      }

      .swiper-pagination-bullet-active {
        background-color: #4361ee;
      }

      .swiper-button {
        border: 1px solid white;
      }

      .swiper-slide img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: auto;
        object-fit: cover;
        border: 3px solid #4361ee;
        outline: 2px solid white;
      }

      .swiper-slide h3 {
        font-size: 1.1rem;
        text-align: center;
        font-weight: bold;
      }

      .swiper-slide p {
        font-size: 0.9rem;
        padding: 5px;
      }

      @media (max-width:638px) {
        .swiper-container {
          width: 100%;
        }
      }

      @media (max-width:500px) {
        .swiper-container {
          width: 70vw;
        }
      }

      @media (max-width:300px) {
        .swiper-container {
          width: 100%;
        }

        .swiper-slide {
          border-radius: 0px;
        }

        .swiper-container .ImgHolder {
          border-radius: 0px;
        }
        .ContentHolder{
          border-radius: 0px;
        }
      }
    </style>

  </head>
  <body>
    <!-- Slider main container -->
    <div id="craouselContainer" class="swiper-container">
      <div class="swiper-wrapper" id="slideHolder">
          <!-- Slides -->

      <div class="swiper-pagination"></div>
    </div>
      
    <script>

          var slideHolder = document.querySelector("#slideHolder")
          for (let i of testiomnialData) slideHolder.innerHTML += `<div class="swiper-slide"> <div class="ImgHolder"><img src="${i.avatar}"></div><div class="ContentHolder"><h3>${i.name}</h3><p>${i.review}</p></div></div>`

          const mySwiper = new Swiper('#craouselContainer', {
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 2,
            loop: true,
            spaceBetween: 30,
            effect: "coverflow",
            coverflowEffect: {
                rotate: 0,
                depth: 800,
                slideShadows: true,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true
            },
            autoplay: { delay: 500 }
          });


          window.onresize = queryResizer
          queryResizer()
          function queryResizer() {
              if (window.innerWidth < 724) mySwiper.params.slidesPerView = 2
              if (window.innerWidth > 501) mySwiper.params.slidesPerView = 2
              if (window.innerWidth > 724) mySwiper.params.slidesPerView = 2.3
              if (window.innerWidth < 501) mySwiper.params.slidesPerView = 1
              mySwiper.update()
          }
        });
    </script>
  </body>
