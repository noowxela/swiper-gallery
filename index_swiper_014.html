<html>
  <head>
    <title>Coverflow Effect - Swiper Js</title>
    <style>/* Variables */
      body {
        background: #111;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #000;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-container {
          width: 100%;
          padding-top: 50px;
          padding-bottom: 80px;
      }

      .swiper-slide {
          background-position: center;
          background-size: cover;
          width: 300px !important;
          height: 300px !important;
          -webkit-box-reflect: below 1px linear-gradient(transparent, transparent, #0006);
      }
      
    </style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <div class="swiper-container">
      <div class="swiper-wrapper">
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/peter-broomfield-m3m-ln-R90u-M-unsplash-bfd5927d.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/brandon-atchison-e-BJWhlq-WR54-unsplash-4f28e146.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/campbell-3-ZUs-NJhi-Ik-unsplash-4ff8de6b.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/evgeny-tchebotarev-aiwu-Lj-LPFn-U-unsplash-ba48e075.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/hakon-sataoen-qyfco1nf-Mtg-unsplash-121d4929.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/joey-banks-YApi-Wyp0lqo-unsplash-d053b374.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/joshua-koblin-eq-W1-MPin-EV4-unsplash-58f2b79a.jpg)"></div>
          <div class="swiper-slide" style="background-image:url(./assets/swiper_014/marcus-p-o-UBjd22g-F6w-unsplash-94534457.jpg)"></div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
    
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Initialize Swiper
        var swiper = new Swiper('.swiper-container', {
            pagination: '.swiper-pagination',
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            coverflow: {
                rotate: 20,
                stretch: 0,
                depth: 200,
                modifier: 1,
                slideShadows: true,
            },
            loop: true,
        });

      });
    </script>
  </body>
</html>
