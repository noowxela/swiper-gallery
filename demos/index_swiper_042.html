    <title>Swiper JS - Coverflow</title>
    <style>/* Variables */
        body {
            background: #e2e2e2;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color:#000;
            margin: 0;
            padding: 0;
        }
        .swiper-container {
            width: 600px;
            padding-top: 150px;
            padding-bottom: 50px;
            overflow: visible !important;
        }
        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 300px !important;
            height: 300px !important;
        }

    </style>

    <body>
        <!-- Slider main container -->
        <div class="swiper-container">
            <div class="swiper-wrapper">
            <div class="swiper-slide" style="background-image:url(../assets/swiper_042/photo-1462556791646-c201b8241a94-67b92fb7.avif)"></div>
            <div class="swiper-slide" style="background-image:url(../assets/swiper_042/photo-1497030855747-0fc424f89a4b-8c169b7e.avif)"></div>
            <div class="swiper-slide" style="background-image:url(../assets/swiper_042/photo-1524287515726-d6bd6805ad27-1bf21524.avif)"></div>
            <div class="swiper-slide" style="background-image:url(../assets/swiper_042/photo-1491166617655-0723a0999cfc-3561e14e.avif)"></div>
            <div class="swiper-slide" style="background-image:url(../assets/swiper_042/photo-1452826942781-56e3f80f6a35-695162d3.avif)"></div>
            </div>
            <!-- Add Pagination -->
            <div class="swiper-pagination"></div>
        </div>
            
        
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var swiper = new Swiper(".swiper-container", {
                    effect: "coverflow",
                    grabCursor: true,
                    centeredSlides: true,
                    slidesPerView: "auto",
                    centeredSlides: true,
                    initialSlide: 2,
                    coverflowEffect: {
                        rotate: 0,
                        stretch: 0,
                        depth: 100,
                        // modifier: 1,
                        // initialSlide: 3,
                        slideShadows: true
                    },
                    pagination: {
                        el: ".swiper-pagination",
                        clickable: true
                    }
                });

            });
        </script>
    </body>
