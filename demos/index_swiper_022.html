<html>
  <head>
    <title>CodePen Home Swiper coverflow </title>
    <style>/* Variables */
      .swiper-container {
        width: 800px;
        height: 400px;
        margin: 0 auto;
      }
      .swiper-slide{
        background-color: red;
        font-size: 80px;
        text-align: center;
        line-height: 400px;
        color: white;
        filter: drop-shadow(0px 4px 24px rgba(0, 0, 0, 0.25));
      }
    </style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script>
  </head>
  <body>
    <!-- Slider main container -->
    <div class="swiper-container">
      <!-- Additional required wrapper -->
      <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide c1">Slide 1</div>
          <div class="swiper-slide c2">Slide 2</div>
          <div class="swiper-slide c3">Slide 3</div>
        <div class="swiper-slide c1">Slide 4</div>
        <div class="swiper-slide c2">Slide 5</div>
      </div>
      <!-- If we need pagination -->
      <div class="swiper-pagination"></div>
      
      <!-- If we need navigation buttons -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
    
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const swiper = new Swiper('.swiper-container', {
            loop: true,
            slidesPerView : 2,
            centeredSlides : true,
            effect : 'coverflow',
            coverflow: {
              rotate: 0,
              stretch: 0,
              depth: 300,
              modifier: 3,
              slideShadows : true
            },
            // If we need pagination
            pagination: '.swiper-pagination',
            
            // Navigation arrows
            nextButton: '.swiper-button-next',
            prevButton: '.swiper-button-prev',
              
          }) 
        });
    </script>
  </body>
</html>
