<html>
  <head>
    <meta charset="utf-8" />
    <title>Swiper coverflow</title>
    <style>/* Variables */
      .swiper-container {
        height: 600;
        width: 750px;
        padding-top: 50px;
        padding-bottom: 50px;
      }
      .swiper-slide{
        width: 300px !important;
      }
    </style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@4.1.6/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@4.1.6/dist/js/swiper.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <!-- Slider main container -->
    <div class="swiper-container">
      <!-- Additional required wrapper -->
      <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
              <img src="../assets/swiper_029/10-e99f6667.jpg" alt="">
          </div>
          <div class="swiper-slide">
              <img src="../assets/swiper_029/11-6ea77e5d.jpg" alt="">
          </div>
          <div class="swiper-slide">
              <img src="../assets/swiper_029/12-b3c699b3.jpg" alt="">
          </div>
      </div>
      <!-- If we need navigation buttons -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const swiper = new Swiper('.swiper-container', {
            loop: true,
            speed: 1000,
            // autoplay: {
            //     delay: 3000,
            // },
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            coverflowEffect: {
                rotate: 0,
                stretch: 80,
                depth: 200,
                modifier: 1,
                slideShadows: false,
            },
            
            // Navigation arrows
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
          });
          
        });
    </script>
  </body>
</html>
