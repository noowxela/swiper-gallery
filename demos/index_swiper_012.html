<html>
  <head>
    <title>Default Swiper Slider</title>
    <style>
      /* body{
        display: flex;
        align-items: center;
        justify-content: center;
      } */

      .swiper-wrapper img {
        width: 100%;
      }
      .swiper-slide{
        display: flex !important;
        align-items: center;
        justify-content: center;
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>

    <div class="swiper-container swiper-initialize">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-14026383-63c7556c.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-13696285-7c45f6e5.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-6483585-55317bbb.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-5232929-e2c3ddbc.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-13624924-7a2decc0.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-13803731-a2f40179.jpeg" alt="">
        </div>
        <div class="swiper-slide">
          <img src="../assets/swiper_012/pexels-photo-5601991-bcfc6cce.jpeg" alt="">
        </div>
      </div>
    
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div> 
    
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Initialize Swiper
        var swiper = new Swiper('.swiper-initialize', {
          slidesPerView: 5,
          spaceBetween: 20,
          breakpoints: {
            1920: {
              slidesPerView: 5
            },
            992: {
              slidesPerView: 3
            },
            320: {
              slidesPerView: 2
            }
          },
          navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev'
          }
        });

      });
    </script>
  </body>
</html>
