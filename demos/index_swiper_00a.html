<html>
  <head>
    <title>Card Slider </title>
    <style>/* Variables */
      * {
        background: none;
        list-style: none;
        outline: none;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        border: none;
      }

      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background-color: #FCFCFD;
        overflow: hidden;
        margin-top: 0;
        padding-top: 100px;
        position: relative;
      }

      img {
        display: block;
      }

      .card {
        width: 400px;
        height: 500px;
        position: relative;
        margin: 0 auto;
        box-shadow: -4px 16px 32px rgba(60, 60, 100, 0.12);
        border-radius: 25px;
        overflow: hidden;
      }

      .card[data-images="images-1"] .images-1,
      .card[data-images="images-2"] .images-2,
      .card[data-images="images-3"] .images-3,
      .card[data-images="images-4"] .images-4,
      .card[data-images="images-5"] .images-5 {
        opacity: 1;
        transform: scale(1);
      }

      .card__slide {
        width: 400px;
        height: 500px;
        position: absolute;
        right: 0;
        top: 0;
        padding: 5px;
      }

      .card__slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.2);
        opacity: 0;
        transition: all .5s ease-in-out; 
      }

    </style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <div class="card" data-images="images-1">
      <div class="card__slide">
          <img  src="../assets/swiper_00a/slide-01-2048-0838cc05.jpg" alt="image-1" class="images-1" />
      </div>
        <div class="card__slide">
          <img  src="../assets/swiper_00a/slide-03-2048-9440406a.jpg" alt="image-2" class="images-2" />
      </div>
        <div class="card__slide">
          <img  src="../assets/swiper_00a/slide-04-2048-24876b7e.jpg" alt="image-3" class="images-3" />
      </div>
        <div class="card__slide">
          <img  src="../assets/swiper_00a/slide-05-2048-959d2bb6.jpg" alt="image-4" class="images-4" />
      </div>
      <div class="card__slide">
            <img  src="../assets/swiper_00a/slide-06-2048-60ee0c2d.jpg" alt="image-5" class="images-5" />
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          let item = 0;
          const card = document.querySelector(".card");
          setInterval(() => {
              (item = (item + 1) % 5), card.setAttribute("data-images", `images-${item + 1}`);
          }, 5e3);
        });
    </script>
  </body>
</html>
