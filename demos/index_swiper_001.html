<html>
  <head>
    <title>Swiper.js Fullscreen Zoom-in Ken Burns effect</title>
    <style>
      /* CSS Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .swiper-container {
        width: 100vw;
        height: 100vh;
      }

      .swiper-slide {
        background-color: #fcfcfc;
        background-size: cover;
        background-position: center;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        color: #fcfcfc;
        font-size: 24px;
      }

      .swiper-slide > .swiper-slide-cover {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background: transparent no-repeat 50% 50% / cover;
      }

      body {
        text-align: center;
      }

      .swiper-slide .slide-01 {
        background-image: url("../assets/swiper_001/slide-16-2048-f12ec38b.jpg");
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-02 {
        background-image: url(../assets/swiper_001/slide-01-2048-0838cc05.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-03 {
        background-image: url(../assets/swiper_001/slide-05-2048-959d2bb6.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-04 {
        background-image: url(../assets/swiper_001/slide-07-2048-aeb70504.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-05 {
        background-image: url(../assets/swiper_001/slide-09-2048-ecaf6724.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-06 {
        background-image: url(../assets/swiper_001/slide-13-2048-ba9312bd.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-07 {
        background-image: url(../assets/swiper_001/slide-08-2048-3712c361.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-08 {
        background-image: url(../assets/swiper_001/slide-11-2048-70a28d1e.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-09 {
        background-image: url(../assets/swiper_001/slide-04-2048-24876b7e.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-10 {
        background-image: url(../assets/swiper_001/slide-03-2048-9440406a.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-11 {
        background-image: url(../assets/swiper_001/slide-06-2048-60ee0c2d.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-12 {
        background-image: url(../assets/swiper_001/slide-12-2048-5630ab4e.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-13 {
        background-image: url(../assets/swiper_001/slide-15-2048-a011d3bd.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-slide .slide-14 {
        background-image: url(../assets/swiper_001/slide-10-2048-fd1f54f2.jpg);
        transform-origin: 50% 50%;
      }

      .swiper-scale-effect .swiper-slide-cover {
        transition-timing-function: linear;
        transition-duration: 20s;
        transform: scale(1);
      }

      .swiper-scale-effect
        .swiper-slide.swiper-slide-active
        .swiper-slide-cover {
        transform: scale(1.3);
      }

      :root {
        --swiper-pagination-bottom: 40px;
        --swiper-theme-color: rgba(252, 252, 252, 0.85) !important;
      }
      .swiper-lazy-preloader-white {
        --swiper-preloader-color: #fcfcfc;
      }
      .swiper-lazy-preloader-black {
        --swiper-preloader-color: #262626;
      }
      .swiper-button-prev,
      .swiper-button-next {
        background: transparent;
        opacity: 0.55;
        --swiper-navigation-color: rgba(252, 252, 252, 0.85);
        transition:
          opacity 0.3s ease,
          color 0.3s ease;
      }
      .swiper-button-prev:hover,
      .swiper-button-next:hover {
        background: transparent;
        opacity: 0.85;
        --swiper-navigation-color: #fcfcfc;
      }
      .swiper-pagination-bullet {
        width: var(
          --swiper-pagination-bullet-width,
          var(--swiper-pagination-bullet-size, 10px)
        ) !important;
        height: var(
          --swiper-pagination-bullet-height,
          var(--swiper-pagination-bullet-size, 10px)
        ) !important;
        box-shadow: inset 1px 1px 1px rgba(38, 38, 38, 0.85);
        background: var(
          --swiper-pagination-bullet-inactive-color,
          rgba(252, 252, 252, 0.85)
        ) !important;
        opacity: var(
          --swiper-pagination-bullet-inactive-opacity,
          0.55
        ) !important;
        --swiper-pagination-bullet-horizontal-gap: 6px;
      }
      .swiper-pagination-bullet-active {
        box-shadow: inset 1px 1px 1px rgba(38, 38, 38, 0.85);
        background: var(
          --swiper-pagination-bullet-active-color,
          rgba(252, 252, 252, 0.85)
        ) !important;
        opacity: var(
          --swiper-pagination-bullet-active-opacity,
          0.85
        ) !important;
        --swiper-pagination-bullet-horizontal-gap: 10px;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script>
  </head>
  <body>
    <!-- Slider main container -->
    <div class="swiper swiper-scale-effect">
      <!-- Swiper -->
      <div class="swiper-container">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
            <div class="slide-01 swiper-slide-cover"></div>
            <div>Slide 01</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-02 swiper-slide-cover"></div>
            <div>Slide 02</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-03 swiper-slide-cover"></div>
            <div>Slide 03</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-04 swiper-slide-cover"></div>
            <div>Slide 04</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-05 swiper-slide-cover"></div>
            <div>Slide 05</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-06 swiper-slide-cover"></div>
            <div>Slide 06</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-07 swiper-slide-cover"></div>
            <div>Slide 07</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-08 swiper-slide-cover"></div>
            <div>Slide 08</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-09 swiper-slide-cover"></div>
            <div>Slide 09</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-10 swiper-slide-cover"></div>
            <div>Slide 10</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-11 swiper-slide-cover"></div>
            <div>Slide 11</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-12 swiper-slide-cover"></div>
            <div>Slide 12</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-13 swiper-slide-cover"></div>
            <div>Slide 13</div>
          </div>
          <div class="swiper-slide">
            <div class="slide-14 swiper-slide-cover"></div>
            <div>Slide 14</div>
          </div>
        </div>
        <!-- Add pagination -->
        <div class="swiper-pagination"></div>
        <!-- Add navigation arrows -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var mySwiper = new Swiper(".swiper-container", {
          direction: "horizontal", // or 'vertical'
          loop: true,
          centeredSlides: true,

          // If we need pagination
          pagination: {
            el: ".swiper-pagination",
            clickable: true,
            dynamicBullets: true,
          },

          // Navigation arrows
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },

          // Autoplay
          autoplay: {
            delay: 5000,
            disableOnInteraction: false,
          },

          // Use slide or fade transition effect
          speed: 2000,
          effect: "fade",
          fadeEffect: {
            crossFade: true,
          },
        });
      });
    </script>
  </body>
</html>
