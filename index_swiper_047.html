.about {
   position: fixed;
   z-index: 10;
   bottom: 10px;
   right: 10px;
   width: 40px;
   height: 40px;
   display: flex;
   justify-content: flex-end;
   align-items: flex-end;
   transition: all 0.2s ease;
}

.about .bg_links {
   width: 40px;
   height: 40px;
   border-radius: 100%;
   display: flex;
   justify-content: center;
   align-items: center;
   background-color: rgba(0, 0, 0, 0.2);
   backdrop-filter: blur(5px);
   position: absolute;
}

.about .logo {
   width: 40px;
   height: 40px;
   z-index: 9;
   background-image: url(./assets/swiper_047/logo_white-a89dce0e.svg);
   background-size: 50%;
   background-repeat: no-repeat;
   background-position: 10px 7px;
   opacity: 0.9;
   transition: all 1s 0.2s ease;
   bottom: 0;
   right: 0;
}

.about .social {
   opacity: 0;
   right: 0;
   bottom: 0;
}

.about .social .icon {
   width: 100%;
   height: 100%;
   background-size: 20px;
   background-repeat: no-repeat;
   background-position: center;
   background-color: transparent;
   display: flex;
   transition: all 0.2s ease, background-color 0.4s ease;
   opacity: 0;
   border-radius: 100%;
}

.about .social.portfolio {
   transition: all 0.8s ease;
}

.about .social.portfolio .icon {
   background-image: url(./assets/swiper_047/link-c482de08.svg);
}

.about .social.dribbble {
   transition: all 0.3s ease;
}

.about .social.dribbble .icon {
   background-image: url(./assets/swiper_047/dribbble-67c60718.svg);
}

.about .social.linkedin {
   transition: all 0.8s ease;
}

.about .social.linkedin .icon {
   background-image: url(./assets/swiper_047/linkedin-db885697.svg);
}

.about:hover {
   width: 105px;
   height: 105px;
   transition: all 0.6s cubic-bezier(0.64, 0.01, 0.07, 1.65);
}

.about:hover .logo {
   opacity: 1;
   transition: all 0.6s ease;
}

.about:hover .social {
   opacity: 1;
}

.about:hover .social .icon {
   opacity: 0.9;
}

.about:hover .social:hover .icon {
   background-size: 28px;
}

.about:hover .social.portfolio {
   right: 0;
   bottom: calc(100% - 40px);
   transition: all 0.3s 0s cubic-bezier(0.64, 0.01, 0.07, 1.65);
}

.about:hover .social.portfolio .icon:hover {
   background-color: #698fb7;
}

.about:hover .social.dribbble {
   bottom: 45%;
   right: 45%;
   transition: all 0.3s 0.15s cubic-bezier(0.64, 0.01, 0.07, 1.65);
}

.about:hover .social.dribbble .icon:hover {
   background-color: #ea4c89;
}

.about:hover .social.linkedin {
   bottom: 0;
   right: calc(100% - 40px);
   transition: all 0.3s 0.25s cubic-bezier(0.64, 0.01, 0.07, 1.65);
}

.about:hover .social.linkedin .icon:hover {
   background-color: #0077b5;
}

/* Media Queries */
@media screen and (max-width: 1240px) {
   /* Add any content-specific styling for large screens */

p,

body {
   margin: 0;

/* Daily */
.daily {
   position: absolute;
   display: flex;
   align-items: center;
   justify-content: center;
   flex-direction: column;
   width: 100%;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
}

.daily .daily-title {
   font-weight: 700;
   font-family: "Barlow", sans-serif; /* Replaced $font-01 with the actual font */
   letter-spacing: 0.04em;
   font-size: 60px;
   color: #d51e34; /* Replaced $m-01 with the color value */
   margin: 0;
   margin-bottom: 20px;
   padding: 0;
}

/* Media Query for small screens */
@media screen and (max-width: 799px) {
   .daily .daily-title {
      font-size: 40px;
   }
}

/* Button */
.btn {
   height: 50px;
   border-radius: 6px;
   background-color: #404145; /* Replaced $neu-06 with the color value */
   color: white;
   font-weight: 500;
   font-size: 16px;
   line-height: 19px;
   letter-spacing: 0.07em;
   text-transform: uppercase;
   font-family: "Barlow", sans-serif; /* Replaced $font-01 with the actual font */
   padding: 0 30px;
   position: relative;
   display: flex;
   cursor: pointer;
   border: 0;
   margin-top: 15px;
}

/* Media Query for extra small screens */
@media screen and (max-width: 511px) {
   .btn {
      margin-top: 5px;
   }
}

.btn span {
   z-index: 1;
   display: block;
}

.btn:after {
   content: "";
   position: absolute;
   height: 3px;
   width: calc(100% - 6px);
   border-radius: 4px;
   background-color: #1c1c1e; /* Replaced $neu-07 with the color value */
   bottom: 3px;
   left: 3px;
   transition: all 0.4s ease;
   opacity: 0.8;
}

.btn:hover:after {
   height: calc(100% - 6px);
}

.btn:focus {
   outline: 0;
}
/* Modal */
.modal {
    width: 100%;
    height: 100%;
    position: relative;
    background: transparent;
    overflow-x: hidden;
    display: none;
    transition: all 0.4s 0.2s ease;
    z-index: 2;
    opacity: 0;
}

.modal.open {
    display: grid;
    opacity: 1;
    background: #a01222; /* Replaced $m-02 with color value */
    transition: all 0.4s 0.2s ease;
}

@media screen and (max-width: 799px) {
    .modal.open {
        background: transparent;
    }
}

.modal .wrapper {
    max-width: 1320px;
    margin: 0 auto;
    position: relative;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    justify-content: center;
    align-items: center;
    padding: 40px 60px;
    animation: modal-in 1.6s ease both;
}

@media screen and (max-width: 1023px) {
    .modal .wrapper {
        padding: 40px;
    }
}

@media screen and (max-width: 511px) {
    .modal .wrapper {
        padding: 0px;
    }
}

.modal .wrapper:after {
    content: "";
    position: absolute;
    height: 100%;
    width: 100vw;
    background-color: #404145; /* Replaced $neu-06 with color value */
    grid-column-start: 6;
    grid-column-end: 100;
    top: 0;
    animation: modal-in 1.6s ease both;
    animation-delay: 0.2s;
}

@media screen and (max-width: 1023px) {
    .modal .wrapper:after {
        height: 48.8%;
        top: initial;
        bottom: 0;
        left: -40px;
        grid-column-start: 1;
        grid-column-end: 100;
    }
}

@media screen and (max-width: 511px) {
    .modal .wrapper:after {
        display: none;
    }
}

.modal .container {
    background: transparent;
    width: 100%;
    height: auto;
    z-index: 2;
    display: grid;
    grid-column-start: 1;
    grid-column-end: 13;
    grid-template-columns: repeat(12, 1fr);
    margin: auto;
    position: relative;
}

.modal .container .icon-close {
    width: 30px;
    height: 30px;
    position: absolute;
    right: 30px;
    top: 30px;
    z-index: 3;
    background-image: url(./assets/swiper_047/icon-61-293798c3.svg);
    opacity: 0.7;
    cursor: pointer;
    transition: all 0.4s ease;
}

@media screen and (max-width: 1023px) {
    .modal .container .icon-close {
        top: 20px;
        right: 20px;
    }
}

.modal .container .icon-close:hover {
    transform: rotate(90deg);
}

.modal .container .title {
    font-weight: bold;
    font-size: 24px;
    line-height: 29px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 40px;
}

.modal .container .left {
    background-color: #f5f5f5; /* Replaced $neu-01 with color value */
    height: 100%;
    border-radius: 30px 0px 0px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column-start: 1;
    grid-column-end: 6;
    padding: 80px 0;
    box-sizing: border-box;
    animation: modal-in 1.6s ease both;
    animation-delay: 0.2s;
}

@media screen and (max-width: 1023px) {
    .modal .container .left {
        border-radius: 20px 20px 0px 0px;
        grid-column-start: 1;
        grid-column-end: 13;
        padding: 60px 30px 40px 30px;
        animation-delay: 0s;
    }
}

@media screen and (max-width: 511px) {
    .modal .container .left {
        border-radius: 0;
    }
}

.modal .container .left .details {
    width: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
}

@media screen and (max-width: 1023px) {
    .modal .container .left .details {
        grid-template-columns: 1fr;
    }
}

.modal .container .left .details .swiper-container {
    background-color: white;
    border-radius: 14px;
    min-width: 220px;
    width: calc(100% + 40px);
    height: 290px;
    transform: translateX(-40px);
    grid-column-start: 1;
    grid-column-end: 8;
    margin-bottom: 40px;
    box-shadow: 0px 30px 30px rgba(0, 0, 0, 0.05);
}

@media screen and (max-width: 1023px) {
    .modal .container .left .details .swiper-container {
        transform: translateX(0px);
        min-width: initial;
        width: 100%;
    }
}

@media screen and (max-width: 511px) {
    .modal .container .left .details .swiper-container {
        margin-bottom: 30px;
    }
}

.modal .container .left .details .swiper-wrapper .swiper-slide {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.modal .container .left .details .swiper-wrapper .swiper-slide img {
    height: 200px;
    margin-top: 30px;
}

.modal .container .left .details .navigation {
    position: absolute;
    display: flex;
    bottom: 0;
    width: 100%;
    height: 30px;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
}

.modal .container .left .details .navigation .swiper-button-prev,
.modal .container .left .details .navigation .swiper-button-next {
    bottom: 0;
    top: initial;
    width: 24px;
    height: 24px;
    position: initial;
    margin-top: 0;
    transition: all 0.4s ease;
    background-image: url("./assets/swiper_047/icon-12-8704ee81.svg");
}

.modal .container .left .details .navigation .swiper-button-prev:hover {
    transform: translateX(-10px);
}

.modal .container .left .details .navigation .swiper-button-next:hover {
    transform: translateX(8px);
}

.modal .container .left .details .navigation .swiper-pagination {
    bottom: 0;
    height: 24px;
    position: initial;
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal .container .left .details .navigation .swiper-pagination .swiper-pagination-bullet {
    background-color: transparent;
    opacity: 1;
    box-shadow: inset 0px 0px 0px 1px #a01222; /* Replaced $m-02 with color value */
    width: 10px;
    height: 10px;
    transition: all 0.4s ease;
    margin: 8px;
}

.modal .container .left .details .navigation .swiper-pagination .swiper-pagination-bullet.swiper-pagination-bullet-active {
    box-shadow: inset 0px 0px 0px 5px #a01222; /* Replaced $m-02 with color value */
}

.modal .container .left .details article {
    grid-column-start: 2;
    grid-column-end: 8;
    animation: modal-in 1.6s ease both;
    animation-delay: 0.4s;
}

@media screen and (max-width: 1023px) {
    .modal .container .left .details article {
        grid-column-start: 1;
    }
}

.modal .container .left .details article .title {
    color: #a01222; /* Replaced $m-02 with color value */
}

.modal .container .left .details article .product {
    font-weight: 600;
    font-size: 24px;
    line-height: 29px;
    color: #404145; /* Replaced $neu-06 with color value */
    margin-bottom: 10px;
}

@media screen and (max-width: 511px) {
    .modal .container .left .details article .product {
        font-size: 20px;
        line-height: 24px;
    }
}

.modal .container .left .details article .type {
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    color: #9c9c9c; /* Replaced $neu-05 with color value */
    margin-bottom: 20px;
}

.modal .container .left .details article .quantity {
    font-weight: normal;
    font-size: 14px;
    line-height: 17px;
    color: #bfbfbf; /* Replaced $neu-04 with color value */
    margin-bottom: 20px;
}

.modal .container .left .details article .total {
    font-weight: 500;
    font-size: 14px;
    line-height: 17px;
    text-transform: uppercase;
    color: #a01222; /* Replaced $m-02 with color value */
    margin-bottom: 5px;
}

.modal .container .left .details article .price {
    font-weight: bold;
    font-size: 36px;
    line-height: 43px;
    color: #a01222; /* Replaced $m-02 with color value */
}

@media screen and (max-width: 511px) {
    .modal .container .left .details article .price {
        font-size: 28px;
        line-height: 34px;
    }
}

.modal .container .right {
    grid-column-start: 6;
    grid-column-end: 13;
    height: 100%;
    border-radius: 0px 30px 30px 0px;
    background-color: #f0f0f0; /* Replaced $neu-02 with color value */
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 80px 0;
    box-sizing: border-box;
    overflow: hidden;
    animation: modal-in 1.6s ease both;
}

@media screen and (max-width: 1023px) {
    .modal .container .right {
        grid-template-columns: 1fr;
        border-radius: 0px 0px 20px 30px;
        grid-column-start: 1;
        padding: 40px 30px 60px 30px;
    }
}

@media screen and (max-width: 511px) {
    .modal .container .right {
        border-radius: 0;
    }
}

.modal .container .right .form {
    width: 100%;
    grid-column-start: 2;
    grid-column-end: 7;
    animation: modal-in 1.6s ease both;
    animation-delay: 0.5s;
}

@media screen and (max-width: 1023px) {
    .modal .container .right .form {
        grid-column-start: 1;
        grid-column-end: 7;
    }
}

.modal .container .right .form .title {
    color: #404145; /* Replaced $neu-06 with color value */
}

.modal .container .right .form .double .double-input {
    display: flex;
    justify-content: space-between;
}

.modal .container .right .form .double .double-input .input-wrapper {
    width: calc(50% - 20px);
}

.modal .container .right .form label {
    display: block;
    font-weight: 500;
    font-size: 14px;
    line-height: 17px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #404145; /* Replaced $neu-06 with color value */
    margin-bottom: 10px;
    width: 100%;
    padding-left: 5px;
}

.modal .container .right .form .input-wrapper {
    position: relative;
    margin-bottom: 25px;
}

.modal .container .right .form .input-wrapper:after,
.modal .container .right .form .input-wrapper:before {
    content: "";
    position: absolute;
    width: 100%;
    background-color: #e0e0e0; /* Replaced $neu-03 with color value */
    height: 2px;
    border-radius: 2px;
    bottom: 0;
    transition: all 0.4s ease;
    right: 0;
}

.modal .container .right .form .input-wrapper:after {
    width: 0;
    background-color: #b2b2b2; /* Replaced $neu-05 with color value */
}

.modal .container .right .form select {
    width: 100%;
    border: 0;
    height: 30px;
    background-color: transparent;
    font-weight: normal;
    font-size: 16px;
    line-height: 19px;
    letter-spacing: 0.07em;
    color: #b2b2b2; /* Replaced $neu-05 with color value */
    font-family: "Barlow", sans-serif;
    padding: 0 0 10px 5px;
    border-radius: 0;
    display: flex;
    align-items: flex-start;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("./assets/swiper_047/icon-14-b7357758.svg");
    background-repeat: no-repeat;
    background-position-x: calc(100% - 5px);
    background-position-y: 0px;
    background-size: 24px;
}

.modal .container .right .form select:focus {
    outline: 0;
}

.modal .container .right .form input {
    font-weight: normal;
    font-size: 16px;
    line-height: 19px;
    letter-spacing: 0.07em;
    width: 100%;
    background-color: transparent;
    border: 0;
    height: 30px;
    color: #b2b2b2; /* Replaced $neu-05 with color value */
    font-family: "Barlow", sans-serif;
    padding: 0 0 10px 5px;
    box-sizing: border-box;
}

.modal .container .right .form input:focus {
    outline: 0;
}

.modal .container .right .form input::placeholder {
    color: #bfbfbf; /* Replaced $neu-04 with color value */
}

.modal .container .right .form .input-wrapper.active:after {
    width: 100%;
    left: 0;
}

.modal .close {
    background: transparent;
    transition: background 1s ease;
}

.modal.close .wrapper {
    animation: modal-out 1.6s ease both;
}

@keyframes modal-out {
    100% {
        transform: translateX(130%);
    }

    0% {
        transform: translateX(0%);
    }
}

@keyframes modal-in {
    0% {
        transform: translateX(130%);
    }

    100% {
        transform: translateX(0%);
    }
}

        <script>
            document.addEventListener('DOMContentLoaded', function () {
            var inputField = document.querySelectorAll("input"),
                inputWrapper = document.querySelectorAll(".input-wrapper"),
                iconClose = document.querySelector(".icon-close"),
                btnOpen = document.querySelector(".btn-open"),
                modal = document.querySelector(".modal");
            //Events
            btnOpen.addEventListener("click", openModal);
            iconClose.addEventListener("click", closeModal);
            // Event to Anime Input
            inputField.forEach(function(el) {
                el.addEventListener("focus", animeInput);
                el.addEventListener("focusout", removeAnimeInput);
            });
            // To anime input
            function animeInput(event) {
                event.target.closest(".input-wrapper").classList.add("active");
            }
            function removeAnimeInput(event) {
                if (event.target.value == "") {
                    event.target.closest(".input-wrapper").classList.remove("active");
                }
            }
            
            // Open Modal
            function openModal() {
                modal.classList.add("open");
            }
            function closeModal() {
                modal.classList.add("close");
                setTimeout(function() {
                    modal.classList.remove("open");
                    modal.classList.remove("close");
                }, 1500);
            }
            //Swiper
            var mySwiper = new Swiper(".swiper-container", {
                // Optional parameters
                direction: "horizontal",
                loop: true,
                effect: "coverflow",
                centeredSlides: true,
                speed: 800,
                coverflowEffect: {
                    rotate: 60,
                    stretch: 10,
                    depth: 150,
                    modifier: 2,
                    slideShadows: false
                },

                // If we need pagination
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true
                },

                // Navigation arrows
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev"
                }
            });
            });
        </script>
