<html>
  <head>
    <meta charset="utf-8" />
    <title>Responsive YouTube Player as Coverflow Slider with Swiper.js</title>
    <style>/* Variables */

      *,
      *:before,
      *:after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [class^="swiper-button-"],
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet,
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet::before {
        -webkit-transition: all 0.3s ease;
        transition: all 0.3s ease;
      }

      .swiper-container {
        width: 100%;
        height: auto;
        -webkit-transition: opacity 0.6s ease;
        transition: opacity 0.6s ease;
      }
      .swiper-container.swiper-container-coverflow {
        margin-top: 60px;
      }
      .swiper-container.loading {
        opacityx: 0;
        visibilityx: hidden;
      }
      .swiper-container:hover .swiper-button-prev,
      .swiper-container:hover .swiper-button-next {
        -webkit-transform: translateX(0);
        transform: translateX(0);
        opacity: 1;
        visibility: visible;
      }

      .swiper-slide {
        background-position: center;
        background-size: cover;
      }
      .swiper-slide img {
        position: absolute;
        width: 100%;
        height: auto;
      }
      .swiper-slide .content {
        position: absolute;
        top: 40%;
        left: 0;
        width: 50%;
        padding-left: 5%;
        color: #fff;
      }
      .swiper-slide .content .title {
        font-size: 2.6em;
        font-weight: bold;
        margin-bottom: 30px;
      }
      .swiper-slide .content .caption {
        display: block;
        font-size: 13px;
        line-height: 1.4;
      }
      .ratioWrapper {
        position: relative;
        width: 100%;
        height: 0;
        background-color: #000;
        padding-top: 56%;
      }
      .ratioWrapper img {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .slide-caption {
        font-family: helvetica;
        color: white;
        text-transform: lowercase;
        letter-spacing: 2px;
        font-size: 15px;
        padding: 10px 12px;
        text-align: center;
        background: #0c0c0c;
      }

      .swiper-slide-active .slide-caption {
        background: transparent;
      }

      [class^="swiper-button-"] {
        width: 44px;
        opacity: 0;
        visibility: hidden;
      }

      .swiper-button-prev {
        -webkit-transform: translateX(50px);
        transform: translateX(50px);
      }

      .swiper-button-next {
        -webkit-transform: translateX(-50px);
        transform: translateX(-50px);
      }

      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet {
        margin: 0px 9px;
        position: relative;
        width: 12px;
        height: 12px;
        background-color: #fff;
        opacity: 0.5;
        visibility: hidden;
      }
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        border: 0px solid #fff;
        border-radius: 50%;
      }
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet:hover,
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet.swiper-pagination-bullet-active {
        opacity: 1;
      }
      .swiper-container-horizontal
        > .swiper-pagination-bullets
        .swiper-pagination-bullet.swiper-pagination-bullet-active::before {
        border-width: 1px;
      }

      @media (max-width: 1023px) {
        .swiper-container {
          height: auto;
        }
        .swiper-container.swiper-container-coverflow {
          margin-top: 0;
        }
        
        .slide-caption {
          font-size: 12px;
        }
      }

      /* **************
        Disable Click Events on Previous and Next Slide
      ************* */

      .swiper-slide-next {pointer-events: none !important;}
      .swiper-slide-prev {pointer-events: none !important;}


      /* **************
      Active Slide Class
      .swiper-slide-active {}
      ************* */

      /* **************
        VIDEO WRAPPER 
      ************* */

      .videoWrapper {
        position: relative;
        width: 100%;
        height: 0;
        background-color: #000;
        padding-top: 56%;
      }

      .videoIframe {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
      }

      .videoPoster {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        cursor: pointer;
        border: 0;
        outline: none;
        background-position: 50% 50%;
        background-size: 100% 100%;
        background-size: cover;
        text-indent: -999em;
        overflow: hidden;
        opacity: 1;
        -webkit-transition: opacity 800ms, height 0s;
        -moz-transition: opacity 800ms, height 0s;
        transition: opacity 800ms, height 0s;
        -webkit-transition-delay: 0s, 0s;
        -moz-transition-delay: 0s, 0s;
        transition-delay: 0s, 0s;
        z-index: 2;
        pointer-events: auto;
      }
      .videoWrapperActive .videoPoster {
        opacity: 0;
        height: 0;
        -webkit-transition-delay: 0s, 800ms;
        -moz-transition-delay: 0s, 800ms;
        transition-delay: 0s, 800ms;
      }
      .videoIframe {
        position: absolute;
        top: 0;
      }
      /* *********
        SVG PLAY BUTTON
      ********** */

      .stroke-dotted {
        stroke-dasharray: 4, 5;
        stroke-width: 1px;
        -webkit-transform-origin: 50% 50%;
        transform-origin: 50% 50%;
        -webkit-animation: spin 4s infinite linear;
        animation: spin 4s infinite linear;
        -webkit-transition: opacity 1s ease, stroke-width 1s ease;
        transition: opacity 1s ease, stroke-width 1s ease;
      }
      .stroke-solid {
        stroke-dashoffset: 0;
        stroke-dasharray: 300;
        stroke-width: 4px;
        -webkit-transition: stroke-dashoffset 1s ease, opacity 1s ease;
        transition: stroke-dashoffset 1s ease, opacity 1s ease;
        opacity: 0;
      }
      .vid-icon {
        -webkit-transition: -webkit-transform 200ms ease-out;
        transition: -webkit-transform 200ms ease-out;
        transition: transform 200ms ease-out;
        transition: transform 200ms ease-out, -webkit-transform 200ms ease-out;
      }

      .play-vid:hover .stroke-dotted {
        stroke-width: 4px;
        opacity: 1;
      }
      .play-vid:hover .stroke-solid {
        opacity: 1;
        stroke-dashoffset: 300;
      }
      .play-vid:hover .icon {
        -webkit-transform: scale(1.05);
        transform: scale(1.05);
        opacity: 1;
      }
      .play-vid {
        cursor: pointer;
        margin: auto;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        opacity: 0.85;
        width: 110px;
        height: 110px;
        z-index: 1;
        pointer-events: none;
      }
      @-webkit-keyframes spin {
        to {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
      @keyframes spin {
        to {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
      body {
        background: #222;
      }

    <script>
        document.addEventListener("click", function (ev) {
            var poster = ev.target.closest && ev.target.closest(".js-videoPoster");
            if (!poster) return;
            ev.preventDefault();
            ev.stopPropagation();
            var wrapper = poster.closest(".js-videoWrapper");
            if (!wrapper || wrapper.classList.contains("videoWrapperActive")) return;
            videoStop();
            videoPlay(wrapper);
        });

        function videoPlay(wrapper) {
            var iframe = wrapper.querySelector(".js-videoIframe");
            var src = iframe.getAttribute("data-src");
            wrapper.classList.add("videoWrapperActive");
            iframe.setAttribute("src", src);
        }

        function videoStop(wrapper) {
            var wrappers;
            var iframes;
            if (!wrapper) {
                wrappers = document.querySelectorAll(".js-videoWrapper");
                iframes = document.querySelectorAll(".js-videoIframe");
            } else {
                wrappers = [wrapper];
                iframes = [wrapper.querySelector(".js-videoIframe")];
            }

            wrappers.forEach(function (item) {
                item.classList.remove("videoWrapperActive");
            });

            iframes.forEach(function (iframe) {
                if (iframe) iframe.setAttribute("src", "");
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
          const mySwiper = new Swiper('.swiper-container', {
            loop: true,
            speed: 800,
            slidesPerView: 2,
            centeredSlides: true,
            effect: "coverflow",
            coverflowEffect: {
              rotate: 50,
              stretch: 0,
              depth: 100,
              modifier: 1,
              slideShadows: false
            },
            grabCursor: true,
            parallax: true,
            preventClicks: false,
            preventClicksPropagation: false,
            threshold: 12,
            noSwiping: true,
            noSwipingClass: "js-videoPoster",
            pagination: {
              el: ".swiper-pagination",
              clickable: false
            },
            navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev"
            },
            keyboard: {
              enabled: true,
              onlyInViewport: false
            },
            breakpoints: {
              1023: {
                slidesPerView: 1,
                spaceBetween: 0
              }
            },
            on: {
              init: function () {
                var el = this.el || this.container;
                if (el) el.classList.remove("loading");
              },
              imagesReady: function () {
                var el = this.el || this.container;
                if (el) el.classList.remove("loading");
              },
              slideChange: function () {
                videoStop();
              }
            }
          });
        });
    </script>
  </body>
</html>
