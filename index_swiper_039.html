<html>
  <head>
    <meta charset="utf-8" />
    <title>Slider #swiper.js</title>
    <style>/* Variables */
    @import url("https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap");

    html,
    body {
        position: relative;
        height: 100%;
    }
    body {
        background: #eee;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #000;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .swiper {
        width: 100%;
        height: auto;
        overflow: visible !important;
        padding: 40px 0 96px;
    }
    .swiper-wrapper {
        overflow: visible !important;
    }
    .swiper-slide {
        background-position: center;
        background-size: cover;
        width: 300px !important;
        height: 300px !important;
        overflow: visible !important;
    }

    .swiper-slide::after {
        position: absolute;
        content: "";
        inset: 0;
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 50%;
        background: linear-gradient(to bottom right, #b8b8b88f, #ffffff5e);
        pointer-events: none;
    }
    .swiper-slide-active::after {
        background: none;
    }
    .swiper-slide > div {
        position: absolute;
        top: calc(100% + 20px);
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: 80vw;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
    .swiper-slide-active > div {
        opacity: 1;
        visibility: visible;
    }

    .swiper-slide h2 {
        font-size: 1.2rem;
        font-family: "Libre Baskerville", serif;
        position: relative;
    }

    .swiper-slide h2::after {
        position: absolute;
        content: "";
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        height: 2px;
        background: linear-gradient(#e66465, #9198e5);
    }

    @keyframes line {
    0% {
        width: 0;
    }
    100% {
        width: 100%;
    }
    }

    .swiper-slide-active h2::after {
        animation: line 0.5s linear forwards;
    }
    .swiper-slide img {
        display: block;
        width: 100%;
        object-fit: cover;
        box-shadow: 0px 3px 17px rgb(0 0 0 / 25%);
        border-radius: 50%;
        aspect-ratio: 1/1;
    }

    @media (min-width: 768px) {
        .swiper-slide h2 {
            font-size: 2rem;
        }
    }

    </style>

  <body>
    <!-- Slider main container -->
    <!-- Swiper -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="./assets/swiper_039/photo-1432139555190-58524dae6a55-db7280ef.avif" alt="Grilled steak with vegetables" />
                <div>
                    <h2>Grilled steak with vegetables</h2>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="./assets/swiper_039/photo-1565299624946-b28f40a0ae38-bb5c4e15.avif" alt="Pizza" />
                <div>
                <h2>Pizza</h2>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="./assets/swiper_039/photo-1482049016688-2d3e1b311543-ad0d34cd.avif" alt="Sandwich with boiled egg" />
                <div>
                <h2>Sandwich with boiled egg</h2>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="./assets/swiper_039/photo-1484723091739-30a097e8f929-6f4a5ce0.avif" alt="Toast bread with blueberry" />
                <div>
                <h2>Toast bread with blueberry</h2>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="./assets/swiper_039/photo-1481070555726-e2fe8357725c-0982a85d.avif" alt="Chicken burger" />
                <div>
                <h2>Chicken burger</h2>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const swiper = new Swiper('.mySwiper', {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                loop: true,
                slidesPerView: "auto",
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 100,
                    modifier: 4,
                    slideShadows: false
                },
                keyboard: {
                    enabled: true
                },
                mousewheel: {
                    thresholdDelta: 70
                },
                initialSlide: 0,
                on: {
                    click(event) {
                    swiper.slideTo(this.clickedIndex);
                    }
                },
                breakpoints: {
                    640: {
                    slidesPerView: "auto"
                    }
                }
            });
        });
    </script>
