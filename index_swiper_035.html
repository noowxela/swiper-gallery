<html>
  <head>
    <meta charset="utf-8" />
    <title>Swiper 3D carousel 16:9 aspect ratio with Tailwindcss</title>
    <style>/* Variables */
      body{
        background-color: #6e6e6e;
      }
      .carousel-3D-swiper-section {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #000;
        margin: 0;
        padding: 0;
        max-width: 1200px;
        margin: auto;
        overflow: hidden;
        min-height: 500px;
      }

      .carousel-3D-swiper-title {
        text-align: center;
        font-size: 3rem;
        color: orangered;
      }

      .carousel-3D-swiper .swiper-slide {
        position: relative;
      }

      .carousel-3D-swiper .image-wrapper {
        overflow: hidden;
        max-height: 225px; /* Use aspect-ratio or a similar technique if needed */
      }

      .carousel-3D-swiper .image-wrapper img {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 225px;
        object-fit: cover;
        border-radius: 8px;
        -webkit-box-reflect: below 5px -webkit-linear-gradient(bottom, rgba(255, 0, 0, 0.1) 0%, transparent 32px, transparent 100%);
      }

      .details {
        padding: 25px 20px;
        font-weight: 600;
        text-align: center;
        background-color: #fff;
      }

      .details span {
        display: block;
        font-size: 16px;
        color: #f44336;
      }

      .details h3 {
        margin: 0;
        font-weight: bold;
        font-size: 24px;
        line-height: 1.1;
      }

      .details p {
        margin: 8px 0 0;
        opacity: 0.65;
        font-size: 14px;
        font-weight: 500;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }

      .carousel-3D-swiper-section .swiper-pagination-bullet {
        margin: 0 4px;
        width: 16px;
        height: 16px;
        z-index: 50;
      }

      .carousel-3D-swiper-section .swiper-pagination-bullet-active {
        opacity: 1;
        background: orange;
      }

    </style>
    
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->

    <link href="https://cdn.jsdelivr.net/npm/swiper@4.1.6/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@4.1.6/dist/js/swiper.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <!-- Slider main container -->
    <section class="my-10">
      <h2 class="carousel-3D-swiper-title">Lorem ipsum dolor sit amet</h2>
      <section class="carousel-3D-swiper-section">
        <!-- Slider main container -->
        <div class="carousel-3D-swiper">
          <!-- Additional required wrapper -->
          <div class="swiper-wrapper" style="max-width: 1200px;">
            <!-- Slides -->
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/pexels-photo-708440-31c7232b.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
                <p>Lorem ipsum dolor</p>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/pexels-photo-1239291-703de5f6.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/pexels-photo-445109-ab8433da.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/pexels-photo-8422523-dfb0a1b5.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/pexels-photo-445109-ab8433da.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="image-wrapper aspect-video">
                <img class="aspect-video" src="./assets/swiper_035/entrepreneur-startup-start-up-man-39866-dd252f74.jpeg" alt="">
              </div>
              <div class="details">
                <h3>Lorem ipsum dolor</h3>
                <span>Web Designer</span>
              </div>
            </div>
          </div>
          <!-- pagination -->
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-pagination" style="bottom: -50px;"></div>
        </div>
      </section>
    </section>
      
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const mySwiper = new Swiper('.carousel-3D-swiper', {
            loop: true,
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 3,
            coverflowEffect: {
              rotate: 0,
              stretch: 0,
              depth: 350,
              modifier: 1,
              slideShadows: true
            },
            navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev",
            },
            pagination: {
              el: ".swiper-pagination"
            }
          });
        });
    </script>
  </body>
</html>
