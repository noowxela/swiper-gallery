<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Different width for slides</title>
    <style>/* Variables */
      :root {
        /* COLOR */
        --hue-color: 220;
        --second-color: hsl(var(--hue-color) 28% 39%);
      }

      .wrapper {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: "Montserrat", sans-serif;
        background-color: var(--second-color);
      }

      .swiper {
        width: min(100%, 1280px);
        border-radius: 10px;
      }

      .swiper-slide {
        display: grid;
        place-items: center;
        font-size: 50px;
        width: 23.125% !important;
        min-height: 500px;
        border-radius: 10px;
        margin-left: 16px;
      }

      .swiper-slide_first {
        background-color: blanchedalmond;
      }

      .swiper-slide_second {
        background-color: cadetblue;
      }

      .swiper-slide_third {
        background-color: darkseagreen;
      }

      /* We use it if necessary so that the width of the slides is larger than the original one */
      .swiper-slide_size_m {
        width: 48.75% !important;
      }

      .swiper-slide_size_l {
        width: 74.375% !important;
      }
      .swiper-wrapper{
        margin-left: -40px;
      }
    </style>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <!-- Swiper -->
      
    <div class="body page__body">
      <div class="wrapper">
        <div class="swiper">
          <ul class="swiper-wrapper">
            <li class="swiper-slide swiper-slide_first">1</li>
            <li class="swiper-slide swiper-slide_second swiper-slide_size_m">2</li>
            <li class="swiper-slide swiper-slide_third">3</li>
          </ul>
        </div>
      </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const swiper = new Swiper('.swiper', {
            loop: true,
            slidesPerView: "auto",
            // spaceBetween: 32
          });
        });
    </script>
  </body>
</html>
