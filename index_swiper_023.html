<html>
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  
    <style>/* Variables */
      .slide-container{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      body {
        background-color: #1B1B1B;
      }

      .swiper-container {
        width: 80%;
        height: 60%;
        overflow: hidden;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.0/swiper-bundle.min.js"></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.5/swiper-bundle.min.js"></script> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/css/swiper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@3.4.2/dist/js/swiper.min.js"></script> -->
  </head>
  <body>
    <!-- Swiper -->
    <div class="slide-container">
      <div class="mySwiper swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="./assets/swiper_023/10-gadgets-for-a-futuristic-home-office-1200x675-d6d624a9.jpg">
          </div>
            
          <div class="swiper-slide">
            <img src="./assets/swiper_023/uneebo-office-design-yNtCxu4kJXk-unsplash-caa1ec91.jpg">
          </div>
            
          <div class="swiper-slide">
            <img src="./assets/swiper_023/resize-1bc7e0ee.jpg">
          </div>
            
          <div class="swiper-slide">
            <img src="https://www.hpe.com/content/dam/hpe/insights/articles/2021/09/how-technology-is-enabling-the-new-hybrid-workspace/How-technology-is-enabling-the-new-hyrbid-workspace.jpg.transform/nxt-original/image.jpeg">
          </div>
            
          <div class="swiper-slide">
            <img src="./assets/swiper_023/amy-colored-f6e8c200.jpg">
          </div>
            
          <div class="swiper-slide">
            <img src="https://cdn.oneesports.gg/cdn-data/2022/02/Anime_HimoutoUmaruChanR-1024x576.webp">
          </div>
            
          <div class="swiper-slide">
            <img src="./assets/swiper_023/f5a385e2976b8d378a55cfa04396315a-c589199f.jpg">
          </div>
            
          <div class="swiper-slide">
            <img src="https://www.cnet.com/a/img/resize/69256d2623afcbaa911f08edc45fb2d3f6a8e172/hub/2023/02/03/afedd3ee-671d-4189-bf39-4f312248fb27/gettyimages-1042132904.jpg?auto=webp&fit=crop&height=675&width=1200">
          </div>
          
          <div class="swiper-slide">
            <img src="./assets/swiper_023/0x0-a9272433.jpg">
          </div>
        </div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
  </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const swiper = new Swiper('.mySwiper', {
            slidesPerView: 3,
            spaceBetween: 30,
            loop: true,
            speed: 1000,
            pagination: {
              el: ".swiper-pagination",
              clickable: true,
            },
            navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev",
            },
            breakpoints: {
              320: {
                slidesPerView: 1,
              },
              480: {
                slidesPerView: 2,
              },
              768: {
                  slidesPerView: 3,
              },
              1200: {
                slidesPerView: 4,
              },
            },
          });
        });
    </script>
  </body>
</html>
