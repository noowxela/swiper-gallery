<html>
  <head>
    <meta charset="utf-8" />
    <title>CoverFlow with item flipping</title>
    <style>/* Variables */
    :root {  /* various fiddle bit - have a play */
      --content-card-scale: 2;
      --content-width: calc((100vh / var(--content-card-scale)) * 2 / 3);
      --content-height: calc(100vh / var(--content-card-scale));
      --font-size: calc(5px + 100vh / 50);
    }

    html, body {
      height: 100%;
      width: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #555 0%, #000 100%);
      color: whitesmoke;
      font-family: sans-serif;
      text-align: center;
    }

    @-webkit-keyframes bounce {
        0% { margin-top:  0px; }
      50% { margin-top: -8px; }
      100% { margin-top:  0px; }
    }

    @keyframes bounce {
        0% { margin-top:  0px; }
      50% { margin-top: -8px; }
      100% { margin-top:  0px; }
    }

    .coverflow {
      height: 100%;
      width: 100%;
      perspective: 2000px;
    }

    .coverflow .content {
      position: absolute;
      top: calc(50% - var(--content-height) / 2);
      left: calc(50% - var(--content-width) / 2);
      width: var(--content-width);
      height: var(--content-height);
      transform-style: preserve-3d;
      transition: all 300ms ease-in-out;
      outline: none;
    }

    .coverflow .content:not(.current):hover .front {
      animation: bounce 250ms normal forwards ease-in-out;
      filter: grayscale(0%) brightness(100%);
    }

    .coverflow .content .front,
    .coverflow .content .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      -webkit-backface-visibility: hidden;
              backface-visibility: hidden;
    }

    .coverflow .content .back {
      top: calc((var(--content-height) - var(--content-width)) / 2);
      left: calc((var(--content-width) - var(--content-height)) / 2);
      height: var(--content-width);
      width: var(--content-height);
      background: radial-gradient(circle at center, navy 0%, black 100%);
      border: 3px solid whitesmoke;
      transform: rotateY(180deg) rotateZ(90deg);
    }

    .coverflow .content .back h2 {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: calc(1.2 * var(--font-size));
      width: 100%;
      margin: 0;
    }

    .coverflow .content .front img {
      vertical-align: middle;
      border-radius: 10px;
      border: 3px groove whitesmoke;
      width: var(--content-width);
      height: var(--content-height);
      -o-object-fit: cover;
        object-fit: cover;
      cursor: pointer;
      filter: grayscale(60%) brightness(80%);
    }

    .coverflow .content.current:not(.selected) .front img {
      filter: grayscale(0%) brightness(100%);
    }

    .coverflow .content .front .info {
      display: none;
      font-size: var(--font-size);
      width: calc(100% + 6px);
      white-space: nowrap;
      text-transform: uppercase;
      outline: none;
    }

    .coverflow .content.current:not(.selected) .front .info {
      display: block;
    }



    </style>

  <body>

    <script>
      // --- Released as KarmaWare by Pete Rai - http://pete.rai.org.uk/

      // --- various fiddle bit - have a play

      const OVERLAP = 0.25; // of width
      const ROTATION = 45; // degrees
      const DELAY = 250; // milliseconds - for various animations
      const SCALE = 1.7; // for when card flips to back
      const SWIPE = 75; // pixels - min swipe length

      // --- globals

      var content = [ ...document.querySelectorAll('div.content')];
      var index = Math.floor(content.length / 2);

      // --- flips an item over

      function action_flip(show) {
      let current = content[index];
      let shown = current.classList.contains('selected');
      let change = false;

      if (show && !shown) {
          change = true;
          current.classList.add('selected');
          current.style.transform = `rotateY(180deg) rotateZ(90deg) scale(${ SCALE })`;
      }
      else if (shown && !show)
      {
          change = true;
          current.style.transform = 'rotateY(0deg)';
          setTimeout (() => { current.classList.remove('selected') }, DELAY);
      }

      return change;
      }

      // --- move to previous item

      function action_prev() {
      if (index) {
          index--;
          action_flow();
      }
      }

      // --- move to next item

      function action_next() {
      if (content.length > (index + 1)) {
          index++;
          action_flow();
      }
      }

      // --- jump to specified item

      function action_goto(i) {
      if (index !== i) {
          index = i;
          action_flow();
      }
      }

      // --- reflow the items

      function action_flow() {
      content.forEach((c, i) =>  {
          let transform = '';
          let zindex = '';
          let offset = c.clientWidth * OVERLAP;

          if (i < index) {
              transform = `translateX(-${ offset * (index - i) }%) rotateY(${ ROTATION }deg)`;
              zindex = i;
          }

          else if (i === index) {
              transform = 'rotateY(0deg) translateZ(140px)';
              zindex = content.length;
          }

          else /* if (i > index) */ {
              transform = `translateX(${ offset * (i - index) }%) rotateY(-${ ROTATION }deg)`;
              zindex = content.length - i;
          }

          c.style.transform = transform;
          c.style.zIndex = zindex;
          c.classList.remove('current');
      });

      setTimeout (() => { content[index].classList.add ('current') }, DELAY);
      }

      // --- state management

      function state(event, context) {

      if (event === 'left') {
          action_flip(false) || action_prev();
      }

      else if (event === 'right') {
          action_flip(false) || action_next();
      }

      else if (event === 'select') {
          context === index ?  action_flip(true) : (action_flip(false) || action_goto(context));
      }

      else if (event === 'submit') {
          action_flip(true);
      }

      else if (event === 'dismiss') {
          action_flip(false);
      }

      else {
          // do nothing here
      }
      }

      // --- event management

      function events() {

      document.addEventListener('keydown', event => {
          const EVENTS = {
              ArrowLeft: 'left',
              ArrowRight: 'right',
              Enter: 'submit',
              Backspace: 'dismiss',
              Escape: 'dismiss'
          };

          state(EVENTS[event.key]);
      });

      document.addEventListener('mouseup', event => {
          if (event.target.classList.contains('coverflow')) state('dismiss');
      });

      let touched = 0

      document.addEventListener('touchstart', event => {
          touched = event.changedTouches[0].screenX;
      });

      document.addEventListener('touchend', event => {
          let moved = touched - event.changedTouches[0].screenX;
          if (moved < 0 && Math.abs(moved) > SWIPE) state('left');
          if (moved > 0 && Math.abs(moved) > SWIPE) state('right');
      });

      addEventListener('resize', (event) => { action_flow() });
      }

      // --- initialisation 

      function init() {

      content.forEach((c, i) =>  {
          c.onclick = () => { state('select', i) };
          c.style.zIndex = index === i ? 1 : 0;
      });

      setTimeout (() => { action_flow() }, DELAY);
      events();
      }

      init();

    </script>
